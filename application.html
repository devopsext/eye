<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --control-bg: #334155;
            --table-hover: #334155;
            --splitter-bg: #334155;
            --splitter-hover: #0284c7;
        }
        body.theme-midnight {
            --bg-color: #0a0a0a;
            --panel-bg: #1f1f1f;
            --text-color: #00f0ff;
            --border-color: #333333;
            --control-bg: #2a2a2a;
            --table-hover: #2a2a2a;
            --splitter-bg: #333333;
            --splitter-hover: #00f0ff;
        }
        body.theme-crimson {
            background: linear-gradient(135deg, #FF1E1E 0%, #8B0000 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(90, 0, 0, 0.85);
            --text-color: #FFD700;
            --border-color: #B22222;
            --control-bg: rgba(139, 0, 0, 0.6);
            --table-hover: rgba(139, 0, 0, 0.4);
            --splitter-bg: #B22222;
            --splitter-hover: #FFD700;
        }
        body.theme-cyberpunk {
            background: linear-gradient(135deg, #FF007F 0%, #2A0845 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(26, 5, 46, 0.85);
            --text-color: #39FF14;
            --border-color: #4A0E4E;
            --control-bg: rgba(58, 12, 85, 0.6);
            --table-hover: rgba(58, 12, 85, 0.4);
            --splitter-bg: #FF007F;
            --splitter-hover: #39FF14;
        }
        body.theme-emerald {
            background: linear-gradient(135deg, #2C6B56 0%, #0F382B 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(27, 77, 62, 0.85);
            --text-color: #E6A15C;
            --border-color: #2C6B56;
            --control-bg: rgba(15, 56, 43, 0.6);
            --table-hover: rgba(15, 56, 43, 0.4);
            --splitter-bg: #2C6B56;
            --splitter-hover: #E6A15C;
        }
        body.theme-solar {
            background: linear-gradient(135deg, #FFCC00 0%, #FF6600 50%, #CC3300 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(19, 39, 66, 0.85);
            --text-color: #FFCC00;
            --border-color: #CC3300;
            --control-bg: rgba(10, 25, 47, 0.7);
            --table-hover: rgba(10, 25, 47, 0.5);
            --splitter-bg: #FF6600;
            --splitter-hover: #FFCC00;
        }
        body.theme-nordic {
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F7FA 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-color: #37474F;
            --border-color: #B2EBF2;
            --control-bg: #B2EBF2;
            --table-hover: #E0F7FA;
            --splitter-bg: #80DEEA;
            --splitter-hover: #37474F;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; transition: background 0.3s, color 0.3s; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        * { box-sizing: border-box; }
        .controls { background: var(--panel-bg); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); flex-shrink: 0; }
        select, input, button { background: var(--control-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; outline: none; font-size: 13px; }
        select:hover, input:hover, button:hover { opacity: 0.9; }
        input:focus { border-color: #0284c7; }
        
        .grid { display: grid; grid-template-columns: minmax(0, 1fr) 8px 460px; gap: 0; align-items: stretch; flex: 1; min-height: 0; }
        
        .charts-wrapper { overflow-y: auto; height: 100%; position: relative; background: rgba(0, 0, 0, 0.15); border-radius: 8px; border: 1px dashed var(--border-color); padding: 15px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px; }
        
        .card { background: var(--panel-bg); border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); min-width: 400px; min-height: 280px; border: 1px solid var(--border-color); display: flex; flex-direction: column; resize: both; overflow: auto; }
        .card.maximized { position: absolute !important; top: 15px !important; left: 15px !important; right: 15px !important; bottom: 15px !important; width: auto !important; height: auto !important; min-width: 0 !important; min-height: 0 !important; z-index: 50; resize: none; grid-column: auto !important; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; cursor: grab; background: rgba(255, 255, 255, 0.05); padding: 6px 8px; border-radius: 4px; user-select: none; }
        .card-header:active { cursor: grabbing; }
        .card.dragging { opacity: 0.4; border: 2px dashed #0284c7; }
        .card.drag-over { border-top: 3px solid #0284c7; }

        .card-header h4 { margin: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .maximize-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 2px 6px; font-size: 11px; border-radius: 4px; cursor: pointer; }
        .maximize-btn:hover { background: var(--control-bg); }

        .inline-legend { display: flex; gap: 8px; font-size: 10px; }
        .chart-container { position: relative; width: 100%; flex: 1; min-height: 180px; }
        
        .splitter { background: var(--splitter-bg); cursor: col-resize; width: 8px; height: 100%; border-radius: 4px; transition: background 0.2s; margin: 0 4px; flex-shrink: 0; }
        .splitter:hover, .splitter.dragging { background: var(--splitter-hover); }

        .verdict-card { background: var(--panel-bg); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--border-color); min-height: 0; }
        .table-container { flex: 1; overflow-y: auto; width: 100%; margin-top: 5px; min-height: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #94a3b8; cursor: default; }
        tr:hover { background: var(--table-hover); }
        tr.selected { background: #0284c7 !important; color: #fff; }
        
        th:nth-child(1), td:nth-child(1) { width: 75px; }
        th:nth-child(2), td:nth-child(2) { width: 45%; }
        th:nth-child(3), td:nth-child(3) { width: 55%; }

        .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; }
        .badge-most { background: #ef4444; color: #fff; }
        .badge-avg { background: #f59e0b; color: #fff; }
        .badge-zero { background: #10b981; color: #fff; }
        .score-num { font-family: monospace; font-size: 11px; opacity: 0.85; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="text" id="applicationSearch" list="applicationList" placeholder="Search application..." oninput="changeFilter()" onchange="changeFilter()" style="width:300px;">
        <datalist id="applicationList"></datalist>

        <input type="color" id="metricColorPicker" value="#38bdf8" onchange="updateMetricColor(this.value)" style="width:36px; height:30px; padding:0; border:none; cursor:pointer; background:transparent;">

        <label for="timeframeSelect"><strong>Frame:</strong></label>
        <select id="timeframeSelect" onchange="changeTimeframe()">
            <option value="60" selected>1 Min</option>
            <option value="180">3 Min</option>
            <option value="300">5 Min</option>
            <option value="600">10 Min</option>
        </select>

        <label for="themeSelect"><strong>Theme:</strong></label>
        <select id="themeSelect" onchange="changeTheme()">
            <option value="midnight">Midnight</option>
            <option value="nordic">Nordic</option>
            <option value="crimson">Crimson</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="solar" selected>Solar</option>
        </select>

        <button onclick="resetLayoutPositions();resetZoomAll()">🔄 Reset</button>
        <span id="modelStatus" style="margin-left:auto; margin-right: 15px; font-size:12px; font-weight:bold; color:#ef4444;">● Model: Training...</span>
        <span id="wsStatus" style="font-size:12px; color:#10b981;">● Connected</span>
    </div>

    <div class="grid" id="mainGrid">
        <div class="charts-wrapper" id="chartsWrapper" ondragover="allowDrop(event)" ondrop="dropOnWrapper(event)">
            <div class="charts-grid" id="chartsContainer"></div>
        </div>

        <div class="splitter" id="dragSplitter"></div>
        
        <div class="verdict-card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Application</th>
                            <th>Impact & Score</th>
                        </tr>
                    </thead>
                    <tbody id="verdictTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = document.getElementById('applicationSearch').value.trim();
        let updateFreqSec = 3;
        let maxDataPoints = Math.floor(180 / updateFreqSec);
        let sharedMetricColor = document.getElementById('metricColorPicker').value;
        const charts = {};
        let ws = null;
        
        const applicationCache = {};
        let availableApplications = [];
        let selectedTimeLabel = null;
        let hoveredIndex = null;

        const defaultOrderedMetrics = [
            "InRequests", "OutRequests", 
            "InLatency", "OutLatency",
            "InErrors", "OutErrors",
            "InThroughput", "OutThroughput",
            "ApplicationCPU", "HostCPU",
            "ApplicationMemory", "HostMemory",
        ];

        let orderedMetrics = [...defaultOrderedMetrics];
        let maximizedChartKey = null;

        const metricsConfig = {
            "InRequests": { label: "In Requests" },
            "InThroughput": { label: "In Throughput" },
            "InLatency": { label: "In Latency" },
            "InErrors": { label: "In Errors" },
            "OutRequests": { label: "Out Requests" },
            "OutThroughput": { label: "Out Throughput" },
            "OutLatency": { label: "Out Latency" },
            "OutErrors": { label: "Out Errors" },
            "ApplicationCPU": { label: "Application CPU" },
            "ApplicationMemory": { label: "Application Memory" },
            "HostCPU": { label: "Host CPU" },
            "HostMemory": { label: "Host Memory" }
        };

        function updateMetricColor(newColor) {
            sharedMetricColor = newColor;
            localStorage.setItem('sharedMetricColor', newColor);
            for (const key in charts) {
                const c = charts[key];
                c.data.datasets[0].borderColor = sharedMetricColor;
                c.update('none');
            }
        }

        function changeTheme() {
            const theme = document.getElementById('themeSelect').value;
            document.body.className = '';
            localStorage.setItem('selectedTheme', theme);
            if (theme === 'midnight') document.body.classList.add('theme-midnight');
            if (theme === 'crimson') document.body.classList.add('theme-crimson');
            if (theme === 'cyberpunk') document.body.classList.add('theme-cyberpunk');
            if (theme === 'solar') document.body.classList.add('theme-solar');
            if (theme === 'nordic') document.body.classList.add('theme-nordic');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                document.getElementById('themeSelect').value = savedTheme;
                changeTheme();
            }
            const savedColor = localStorage.getItem('sharedMetricColor');
            if (savedColor) {
                sharedMetricColor = savedColor;
                document.getElementById('metricColorPicker').value = savedColor;
            }
            const savedOrder = localStorage.getItem('chartOrder');
            if (savedOrder) {
                try {
                    const parsed = JSON.parse(savedOrder);
                    if (Array.isArray(parsed) && parsed.length === defaultOrderedMetrics.length) {
                        orderedMetrics = parsed;
                    }
                } catch(e) {}
            }
            const savedMax = localStorage.getItem('maximizedChartKey');
            if (savedMax) {
                maximizedChartKey = savedMax;
            }
            initCharts();
            connectWS();
        });

        const splitter = document.getElementById('dragSplitter');
        const mainGrid = document.getElementById('mainGrid');
        let isDragging = false;

        splitter.addEventListener('mousedown', (e) => {
            isDragging = true;
            splitter.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const gridRect = mainGrid.getBoundingClientRect();
            const newVerdictWidth = gridRect.right - e.clientX - 8;
            const minWidth = 280;
            const maxWidth = gridRect.width - 500;
            if (newVerdictWidth >= minWidth && newVerdictWidth <= maxWidth) {
                mainGrid.style.gridTemplateColumns = 'minmax(0, 1fr) 8px ' + newVerdictWidth + 'px';
                localStorage.setItem('verdictWidth', newVerdictWidth);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                splitter.classList.remove('dragging');
                document.body.style.cursor = 'default';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedWidth = localStorage.getItem('verdictWidth');
            if (savedWidth) {
                mainGrid.style.gridTemplateColumns = 'minmax(0, 1fr) 8px ' + savedWidth + 'px';
            }
        });

        const correlationLinePlugin = {
            id: 'correlationLinePlugin',
            afterDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const dataset = chart.data.datasets[0];
                if (!dataset) return;

                ctx.save();
                
                if (dataset._violationTypes) {
                    const top = chart.chartArea.top;
                    const bottom = chart.chartArea.bottom;
                    const meta = chart.getDatasetMeta(0);

                    let startX = null;
                    let endX = null;
                    let currentType = null;

                    meta.data.forEach((element, index) => {
                        const vType = dataset._violationTypes[index];
                        if (vType) {
                            const x = element.x;
                            if (startX === null) {
                                startX = x - 12;
                                currentType = vType;
                            } else if (currentType !== vType) {
                                drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                                startX = x - 12;
                                currentType = vType;
                            }
                            endX = x + 12;
                        } else {
                            if (startX !== null) {
                                drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                                startX = null;
                                endX = null;
                                currentType = null;
                            }
                        }
                    });

                    if (startX !== null) {
                        drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                    }
                }

                if (hoveredIndex !== null) {
                    const meta = chart.getDatasetMeta(0);
                    if (meta.data[hoveredIndex]) {
                        const x = meta.data[hoveredIndex].x;
                        const top = chart.chartArea.top;
                        const bottom = chart.chartArea.bottom;

                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.moveTo(x, top);
                        ctx.lineTo(x, bottom);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }

                ctx.restore();
            }
        };

        function drawViolationRect(ctx, startX, endX, top, bottom, type) {
            const grad = ctx.createLinearGradient(0, top, 0, bottom);
            if (type === 'high') {
                grad.addColorStop(0, 'rgba(239, 68, 68, 0.3)');
                grad.addColorStop(1, 'rgba(239, 68, 68, 0.05)');
            } else {
                grad.addColorStop(0, 'rgba(59, 130, 246, 0.05)');
                grad.addColorStop(1, 'rgba(59, 130, 246, 0.35)');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(startX, top, (endX - startX), bottom - top);
        }

        Chart.register(correlationLinePlugin);

        function syncZoom(targetChart) {
            const scale = targetChart.scales.x;
            const min = scale.min;
            const max = scale.max;

            for (const key in charts) {
                if (charts[key] !== targetChart) {
                    charts[key].options.scales.x.min = min;
                    charts[key].options.scales.x.max = max;
                    charts[key].update('none');
                }
            }
        }

        let draggedMetricKey = null;

        function handleDragStart(e) {
            draggedMetricKey = this.getAttribute('data-metric');
            this.closest('.card').classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            const card = this.closest('.card');
            if (card) card.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            const card = this.closest('.card');
            if (card) card.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            const targetCard = this.closest('.card');
            if (targetCard) targetCard.classList.remove('drag-over');

            const targetMetricKey = this.getAttribute('data-metric');
            if (draggedMetricKey && targetMetricKey && draggedMetricKey !== targetMetricKey) {
                const oldIdx = orderedMetrics.indexOf(draggedMetricKey);
                const newIdx = orderedMetrics.indexOf(targetMetricKey);
                if (oldIdx > -1 && newIdx > -1) {
                    orderedMetrics.splice(oldIdx, 1);
                    orderedMetrics.splice(newIdx, 0, draggedMetricKey);
                    localStorage.setItem('chartOrder', JSON.stringify(orderedMetrics));
                    initCharts();
                }
            }
            return false;
        }

        function handleDragEnd(e) {
            document.querySelectorAll('.card').forEach(c => {
                c.classList.remove('dragging');
                c.classList.remove('drag-over');
            });
            draggedMetricKey = null;
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropOnWrapper(e) {
            e.preventDefault();
            if (draggedMetricKey) {
                const oldIdx = orderedMetrics.indexOf(draggedMetricKey);
                if (oldIdx > -1) {
                    orderedMetrics.splice(oldIdx, 1);
                    orderedMetrics.push(draggedMetricKey);
                    localStorage.setItem('chartOrder', JSON.stringify(orderedMetrics));
                    initCharts();
                }
            }
        }

        function toggleMaximize(key) {
            if (maximizedChartKey === key) {
                maximizedChartKey = null;
                localStorage.removeItem('maximizedChartKey');
            } else {
                maximizedChartKey = key;
                localStorage.setItem('maximizedChartKey', key);
            }
            initCharts();
        }

        function initCharts() {
            for (const key in charts) {
                if (charts[key]) {
                    charts[key].destroy();
                }
            }
            Object.keys(charts).forEach(k => delete charts[k]);

            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';
            
            const keysToRender = maximizedChartKey ? [maximizedChartKey] : orderedMetrics;
            if (maximizedChartKey) {
                container.style.gridTemplateColumns = '1fr';
            } else {
                container.style.gridTemplateColumns = 'repeat(auto-fit, minmax(400px, 1fr))';
            }

            keysToRender.forEach(key => {
                const cfg = metricsConfig[key];
                if (!applicationCache[currentFilter]) {
                    applicationCache[currentFilter] = { rawSeries: {}, verdictsHtml: "" };
                }
                if (!applicationCache[currentFilter].rawSeries[key]) {
                    applicationCache[currentFilter].rawSeries[key] = [];
                }

                const card = document.createElement('div');
                card.className = 'card' + (maximizedChartKey === key ? ' maximized' : '');
                card.id = 'card_' + key;

                const maxBtnText = (maximizedChartKey === key) ? '❐' : '🗖';

                card.innerHTML = '<div class="card-header" draggable="true" data-metric="' + key + '">' +
                    '<h4>☰ ' + cfg.label + '</h4>' +
                    '<div class="header-actions">' +
                        '<div class="inline-legend">' +
                            '<span style="color:#ef4444">--- Upper</span>' +
                            '<span style="color:#3b82f6">--- Lower</span>' +
                        '</div>' +
                        '<button class="maximize-btn" onclick="toggleMaximize(\'' + key + '\')">' + maxBtnText + '</button>' +
                    '</div>' +
                '</div>' +
                '<div class="chart-container"><canvas id="chart_' + key + '"></canvas></div>';
                
                const header = card.querySelector('.card-header');
                header.addEventListener('dragstart', handleDragStart);
                header.addEventListener('dragenter', handleDragEnter);
                header.addEventListener('dragover', handleDragOver);
                header.addEventListener('dragleave', handleDragLeave);
                header.addEventListener('drop', handleDrop);
                header.addEventListener('dragend', handleDragEnd);

                container.appendChild(card);

                const ctx = document.getElementById('chart_' + key).getContext('2d');
                charts[key] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [
                        { label: cfg.label, data: [], borderColor: sharedMetricColor, backgroundColor: 'transparent', tension: 0.2, _violationPoints: [], _violationTypes: [] },
                        { label: 'Upper Limit', data: [], borderColor: '#ef4444', borderDash: [4, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 },
                        { label: 'Lower Limit', data: [], borderColor: '#3b82f6', borderDash: [2, 2], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 }
                    ]},
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { 
                            y: { beginAtZero: false, grid: { color: 'rgba(100, 116, 139, 0.2)' } }, 
                            x: { grid: { color: 'rgba(100, 116, 139, 0.2)' } } 
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        onHover: (event, activeElements) => {
                            if (activeElements.length > 0) {
                                hoveredIndex = activeElements[0].index;
                            } else {
                                hoveredIndex = null;
                            }
                            for (const k in charts) {
                                charts[k].update('none');
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    title: function(context) { return 'Time: ' + context[0].label; },
                                    label: function(context) {
                                        if (context.datasetIndex > 0) return null;
                                        let label = context.dataset.label || '';
                                        if (label) label += ': ';
                                        if (context.parsed.y !== null) label += context.parsed.y.toFixed(2);
                                        return label;
                                    },
                                    afterBody: function(context) {
                                        const idx = context[0].dataIndex;
                                        const activeSeries = applicationCache[currentFilter] ? applicationCache[currentFilter].rawSeries[key] : null;
                                        const pt = activeSeries ? activeSeries[idx] : null;
                                        if (pt && pt.val > pt.up) return '\n⚠️ VIOLATION: Exceeds Upper Limit (' + pt.up.toFixed(2) + ')!';
                                        if (pt && pt.val < pt.lo) return '\n⚠️ VIOLATION: Below Lower Limit (' + pt.lo.toFixed(2) + ')!';
                                        return '\nStatus: Normal';
                                    }
                                }
                            },
                            zoom: {
                                zoom: {
                                    wheel: { enabled: false },
                                    pinch: { enabled: false },
                                    mode: 'x',
                                    drag: {
                                        enabled: true,
                                        backgroundColor: 'rgba(56, 189, 248, 0.25)',
                                        borderColor: 'rgba(56, 189, 248, 0.8)',
                                        borderWidth: 1
                                    },
                                    onZoom: ({chart}) => syncZoom(chart)
                                },
                                pan: { 
                                    enabled: true, 
                                    mode: 'x',
                                    onPan: ({chart}) => syncZoom(chart)
                                }
                            }
                        }
                    }
                });
                redrawChart(key);
            });
        }

        function resetZoomAll() {
            for (const key in charts) { 
                if (charts[key]) {
                    charts[key].resetZoom();
                    delete charts[key].options.scales.x.min;
                    delete charts[key].options.scales.x.max;
                    charts[key].update('none');
                }
            }
        }

        function resetLayoutPositions() {
            orderedMetrics = [...defaultOrderedMetrics];
            maximizedChartKey = null;
            localStorage.removeItem('maximizedChartKey');
            localStorage.removeItem('chartOrder');
            localStorage.removeItem('verdictWidth');
            mainGrid.style.gridTemplateColumns = 'minmax(0, 1fr) 8px 460px';
            initCharts();
        }

        function changeFilter() {
            const inputVal = document.getElementById('applicationSearch').value.trim();
            if (!inputVal) return;

            saveCurrentStateToCache();
            currentFilter = inputVal;
            selectedTimeLabel = null;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "filter", application: currentFilter }));
            }

            if (!applicationCache[currentFilter]) {
                applicationCache[currentFilter] = { rawSeries: {}, verdictsHtml: "" };
            }

            loadStateFromCache(currentFilter);
        }

        function saveCurrentStateToCache() {
            if (applicationCache[currentFilter]) {
                applicationCache[currentFilter].verdictsHtml = document.getElementById('verdictTableBody').innerHTML;
            }
        }

        function loadStateFromCache(applicationKey) {
            document.getElementById('verdictTableBody').innerHTML = applicationCache[applicationKey] ? (applicationCache[applicationKey].verdictsHtml || "") : "";
            document.querySelectorAll('#verdictTableBody tr').forEach(row => {
                const timeLbl = row.getAttribute('data-time');
                if (timeLbl) {
                    row.onclick = function() { selectVerdict(timeLbl, row); };
                }
            });

            for (const key in charts) {
                redrawChart(key);
            }
        }

        function changeTimeframe() {
            const totalWindowSec = parseInt(document.getElementById('timeframeSelect').value);
            maxDataPoints = Math.max(10, Math.floor(totalWindowSec / updateFreqSec));
            for (const key in charts) { redrawChart(key); }
        }

        function redrawChart(key) {
            const c = charts[key];
            if (!c) return;
            if (!applicationCache[currentFilter]) {
                applicationCache[currentFilter] = { rawSeries: {}, verdictsHtml: "" };
            }
            if (!applicationCache[currentFilter].rawSeries[key]) {
                applicationCache[currentFilter].rawSeries[key] = [];
            }
            const series = applicationCache[currentFilter].rawSeries[key];
            const trimmed = series.slice(-maxDataPoints);

            c.data.labels = trimmed.map(pt => pt.time);
            c.data.datasets[0].data = trimmed.map(pt => pt.val);
            c.data.datasets[1].data = trimmed.map(pt => pt.up);
            c.data.datasets[2].data = trimmed.map(pt => pt.lo);

            c.data.datasets[0]._violationTypes = trimmed.map(pt => {
                if (pt.val > pt.up) return 'high';
                if (pt.val < pt.lo) return 'low';
                return null;
            });
            c.data.datasets[0]._violationPoints = trimmed.map(pt => pt.val > pt.up || pt.val < pt.lo);

            c.data.datasets[0].pointRadius = trimmed.map((pt, idx) => {
                if (pt.time === selectedTimeLabel) return 8;
                if (hoveredIndex === idx) return 6;
                return 0;
            });
            c.data.datasets[0].pointBackgroundColor = trimmed.map(pt => (pt.time === selectedTimeLabel) ? '#eab308' : sharedMetricColor);
            c.data.datasets[0].pointBorderColor = trimmed.map(pt => (pt.time === selectedTimeLabel) ? '#ffffff' : sharedMetricColor);

            c.update('none');
        }

        function selectVerdict(timeLabel, rowElement) {
            if (selectedTimeLabel === timeLabel) {
                selectedTimeLabel = null;
                document.querySelectorAll('#verdictTableBody tr').forEach(tr => tr.classList.remove('selected'));
            } else {
                selectedTimeLabel = timeLabel;
                document.querySelectorAll('#verdictTableBody tr').forEach(tr => tr.classList.remove('selected'));
                rowElement.classList.add('selected');
            }
            for (const key in charts) { redrawChart(key); }
        }

        async function fetchModelState() {
            try {
                const res = await fetch('{{.ApiStatePath}}');
                const data = await res.json();
                const ms = document.getElementById('modelStatus');
                if (data.state === 'ready') {
                    ms.style.color = '#10b981';
                    ms.innerText = '● ' + data.model + ': Ready';
                } else if (data.state === 'training') {
                    ms.style.color = '#f59e0b';
                    ms.innerText = '● ' + data.model + ': Training...';
                } else if (data.state === 'trainerror') {
                    ms.style.color = '#ef4444';
                    ms.innerText = '● ' + data.model + ': Train error';
                } else if (data.state === 'detecting') {
                    ms.style.color = 'rgb(49, 43, 226)';
                    ms.innerText = '● ' + data.model + ': Detecting...';
                } else if (data.state === 'detecterror') {
                    ms.style.color = '#ef4444';
                    ms.innerText = '● ' + data.model + ': Detect error';
                } else {
                    ms.style.color = '#ef4444';
                    ms.innerText = '● ' + data.model + ': Not Ready';
                }
            } catch(e) {}
        }
        setInterval(fetchModelState, 1000);
        fetchModelState();

        function addApplication(app) {
            if (!applicationCache[app]) {
                const datalist = document.getElementById('applicationList');
                const opt = document.createElement('option');
                opt.value = app;
                datalist.appendChild(opt);
                applicationCache[app] = { rawSeries: {}, verdictsHtml: "" };
            }
        }

        function connectWS() {
            const loc = window.location;
            const wsProtocol = loc.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(wsProtocol + loc.host + '{{.WebsocketPath}}');

            ws.onopen = function() {
                const wsStatus = document.getElementById('wsStatus');
                if (wsStatus) {
                    wsStatus.innerText = '● Connected';
                    wsStatus.style.color = '#10b981';
                }
                ws.send(JSON.stringify({ type: 'filter', application: currentFilter }));
            };

            ws.onmessage = function(event) {
                const v = JSON.parse(event.data);
                const app = v.ident;

                if (app === '') {
                    return
                }
                const timeLabel = new Date(v.timestamp).toLocaleTimeString();

                if (v.points) {
                    v.points.forEach(point => {
                        addApplication(app);
                        if (!applicationCache[app].rawSeries[point.metric]) {
                            applicationCache[app].rawSeries[point.metric] = [];
                        }
                        applicationCache[app].rawSeries[point.metric].push({
                            time: timeLabel,
                            val: point.value,
                            up: point.max,
                            lo: point.min
                        });
                        if (applicationCache[app].rawSeries[point.metric].length > 200) {
                            applicationCache[app].rawSeries[point.metric].shift();
                        }
                    });
                }

                if (app === currentFilter) {

                    if (v.points) {
                        v.points.forEach(point => {
                            if (charts[point.metric]) {
                                redrawChart(point.metric);
                            }
                        });
                    }

                    if (v.verdict) {

                        const vv = v.verdict
                        const tbody = document.getElementById('verdictTableBody');
                        let badgeClass = 'badge-zero';
                        if (vv.impact === '{{.CaseImpactSevere}}') badgeClass = 'badge-most';
                        else if (vv.impact === '{{.CaseImpactAverage}}') badgeClass = 'badge-avg';

                        const row = document.createElement('tr');
                        row.setAttribute('data-time', timeLabel);
                        if (timeLabel === selectedTimeLabel) row.className = 'selected';
                        
                        const largeHint = '• Application: ' + v.ident + '\n' +
                                          '• Impact: ' + vv.impact + '\n' +
                                          '• Score: ' + vv.score + '\n' +
                                          '• Category: ' + vv.category + '\n' +
                                          '• Event Name: ' + vv.name + '\n' +
                                          '• Root Cause:  ' + vv.root_cause + '\n';
                        row.title = largeHint;

                        row.innerHTML = '<td>' + timeLabel + '</td>' +
                            '<td><strong>' + v.ident + '</strong></td>' +
                            '<td><span class="badge ' + badgeClass + '">' + vv.impact + '</span><span class="score-num">(score: ' + vv.score + ')</span></td>';
                        
                        row.onclick = function() { selectVerdict(timeLabel, row); };

                        tbody.insertBefore(row, tbody.firstChild);
                        if (tbody.rows.length > 30) tbody.deleteRow(tbody.rows.length - 1);

                        applicationCache[currentFilter].verdictsHtml = tbody.innerHTML;
                    }
                }
            };

            ws.onclose = function() { 
                const wsStatus = document.getElementById('wsStatus');
                if (wsStatus) {
                    wsStatus.innerText = '○ Disconnected';
                    wsStatus.style.color = '#ef4444';
                }
                setTimeout(connectWS, 3000); 
            };
        }
    </script>
</body>
</html>
