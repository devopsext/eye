<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --control-bg: #334155;
            --table-hover: #334155;
            --splitter-bg: #334155;
            --splitter-hover: #0284c7;
        }
        body.theme-midnight {
            --bg-color: #0a0a0a;
            --panel-bg: #1f1f1f;
            --text-color: #00f0ff;
            --border-color: #333333;
            --control-bg: #2a2a2a;
            --table-hover: #2a2a2a;
            --splitter-bg: #333333;
            --splitter-hover: #00f0ff;
        }
        body.theme-solar {
            background: linear-gradient(135deg, #FFCC00 0%, #FF6600 50%, #CC3300 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(19, 39, 66, 0.85);
            --text-color: #FFCC00;
            --border-color: #CC3300;
            --control-bg: rgba(10, 25, 47, 0.7);
            --table-hover: rgba(10, 25, 47, 0.5);
            --splitter-bg: #FF6600;
            --splitter-hover: #FFCC00;
        }
        body.theme-nordic {
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F7FA 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-color: #37474F;
            --border-color: #B2EBF2;
            --control-bg: #B2EBF2;
            --table-hover: #E0F7FA;
            --splitter-bg: #80DEEA;
            --splitter-hover: #37474F;
        }
        body.theme-obsidian {
            background: linear-gradient(135deg, #090d16 0%, #171524 100%) !important;
            --bg-color: transparent;
            --panel-bg: rgba(22, 24, 38, 0.9);
            --text-color: #c4b5fd;
            --border-color: #312e81;
            --control-bg: rgba(49, 46, 129, 0.45);
            --table-hover: rgba(49, 46, 129, 0.3);
            --splitter-bg: #4338ca;
            --splitter-hover: #a78bfa;
        }
        body.theme-monokai {
            --bg-color: #1e1f1c;
            --panel-bg: #272822;
            --text-color: #a6e22e;
            --border-color: #49483e;
            --control-bg: #3e3d32;
            --table-hover: #3e3d32;
            --splitter-bg: #75715e;
            --splitter-hover: #f92672;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; transition: background 0.3s, color 0.3s; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        * { box-sizing: border-box; }
        .controls { background: var(--panel-bg); padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); flex-shrink: 0; }
        select, input, button { background: var(--control-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; outline: none; font-size: 13px; cursor: pointer; }
        select:hover, input:hover, button:hover { opacity: 0.9; }
        input[type="text"]:hover, input[type="text"]:focus { cursor: text; }
        input:focus { border-color: #0284c7; }
        button.paused-active { background: #f59e0b !important; color: #0f172a !important; border-color: #d97706 !important; font-weight: 600; }

        .grid { display: grid; grid-template-columns: minmax(0, 1fr) 8px 540px; gap: 0; align-items: stretch; flex: 1; min-height: 0; transition: grid-template-columns 0.2s ease; }
        .grid.panel-collapsed { grid-template-columns: minmax(0, 1fr) 0px 0px !important; }
        .grid.panel-collapsed .splitter, .grid.panel-collapsed .verdict-card { display: none !important; }

        .charts-wrapper { overflow-y: auto; height: 100%; position: relative; background: rgba(0, 0, 0, 0.15); border-radius: 8px; border: 1px dashed var(--border-color); padding: 15px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 15px; }

        .card { background: var(--panel-bg); border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); min-width: 500px; min-height: 280px; border: 1px solid var(--border-color); display: flex; flex-direction: column; resize: both; overflow: auto; }
        .card.maximized { position: absolute !important; top: 15px !important; left: 15px !important; right: 15px !important; bottom: 15px !important; width: auto !important; height: auto !important; min-width: 0 !important; min-height: 0 !important; z-index: 50; resize: none; grid-column: auto !important; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; cursor: grab; background: rgba(255, 255, 255, 0.05); padding: 6px 8px; border-radius: 4px; user-select: none; }
        .card-header:active { cursor: grabbing; }
        .card.dragging { opacity: 0.4; border: 2px dashed #0284c7; }
        .card.drag-over { border-top: 3px solid #0284c7; }

        .card-header h4 { margin: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .maximize-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 2px 6px; font-size: 11px; border-radius: 4px; cursor: pointer; }
        .maximize-btn:hover { background: var(--control-bg); }

        .inline-legend { display: flex; gap: 8px; font-size: 11px; align-items: center; }
        .inline-legend label { display: flex; align-items: center; gap: 3px; cursor: pointer; margin: 0; font-weight: 500; }
        .inline-legend input[type="checkbox"] { margin: 0; padding: 0; cursor: pointer; width: 13px; height: 13px; }
        .chart-container { position: relative; width: 100%; flex: 1; min-height: 180px; }

        .splitter { background: var(--splitter-bg); cursor: col-resize; width: 8px; height: 100%; border-radius: 4px; transition: background 0.2s; margin: 0 4px; flex-shrink: 0; }
        .splitter:hover, .splitter.dragging { background: var(--splitter-hover); }

        .verdict-card { background: var(--panel-bg); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--border-color); min-height: 0; }
        .verdict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
        .verdict-header h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-color); }
        .verdict-filters { display: flex; gap: 6px; align-items: center; }
        .table-container { flex: 1; overflow-y: auto; width: 100%; margin-top: 5px; min-height: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #94a3b8; cursor: default; }
        tr:hover { background: var(--table-hover); }
        tr.selected { background: #0284c7 !important; color: #fff; }

        .table-container th:nth-child(1), .table-container td:nth-child(1) { width: 72px; }
        .table-container th:nth-child(2), .table-container td:nth-child(2) { width: auto; }
        .table-container th:nth-child(3), .table-container td:nth-child(3) { width: 95px; text-align: center; }
        .table-container th:nth-child(4), .table-container td:nth-child(4) { width: 90px; text-align: center; }
        .table-container th:nth-child(5), .table-container td:nth-child(5) { width: 58px; }

        .verdict-details-panel {
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.22);
            display: none;
            flex-direction: column;
            max-height: 45%;
            min-height: 110px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .verdict-details-panel.visible {
            display: flex;
        }
        .verdict-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .verdict-details-close {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 1px 6px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.3;
        }
        .verdict-details-close:hover {
            background: var(--control-bg);
        }
        .verdict-details-body {
            padding: 8px 10px;
            overflow-y: auto;
            font-size: 12px;
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 6px 12px;
            align-items: baseline;
        }
        .verdict-detail-key {
            font-weight: 600;
            opacity: 0.78;
            white-space: nowrap;
            text-transform: capitalize;
        }
        .verdict-detail-val {
            word-break: break-word;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11.5px;
        }

        .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; }
        .badge-red { background: #ef4444; color: #fff; }
        .badge-yellow { background: #f59e0b; color: #fff; }
        .badge-green { background: #10b981; color: #fff; }
        .text-red { color: #ef4444; }
        .text-yellow { color:  #f59e0b; }
        .text-green { color:  #10b981; }
        .score-num { font-family: monospace; font-size: 11px; opacity: 0.85; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="resetLayoutPositions();resetZoomAll();">R</button>

        <select id="themeSelect" onchange="changeTheme()">
            <option value="midnight">Midnight</option>
            <option value="nordic">Nordic</option>
            <option value="monokai">Monokai</option>
            <option value="obsidian">Obsidian</option>
            <option value="solar" selected>Solar</option>
        </select>

        <select id="timeframeSelect" onchange="changeTimeframe()">
            <option value="60" selected>1 Min</option>
            <option value="180">3 Min</option>
            <option value="300">5 Min</option>
            <option value="600">10 Min</option>
        </select>

        <select id="kindSelect" onchange="handleKindChange()" style="width:100px;">
            <option value="all" selected>All Kinds</option>
        </select>

        <select id="dimensionSelect" onchange="handleDimensionChange()" style="width:200px;">
            <option value="all" selected>All Dimensions</option>
        </select>

        <input type="text" id="applicationSearch" list="applicationList" placeholder="Search application or regex (e.g. app.*)..." oninput="handleApplicationSearchInput()" onchange="handleApplicationFilterChange()" style="width:300px;">
        <datalist id="applicationList"></datalist>

        <input type="text" id="hostSearch" list="hostList" placeholder="Search host or regex (e.g. host.*)..." oninput="handleHostSearchInput()" onchange="handleHostFilterChange()" style="width:240px;">
        <datalist id="hostList"></datalist>

        <label style="font-size: 13px; cursor: pointer; margin-right: auto; ">
            <input type="checkbox" id="top5FilterToggle" checked onchange="handleTopToggleChange()">Top
        </label>
      
        <span id="modelStatus" style="font-size:12px; color:#4169E1;">Unknown</span>
        <span id="wsStatus" style="font-size:12px; color:#10b981;">● Connected</span>
        <button id="pauseToggleBtn" onclick="togglePause()">⏸</button>
        <button id="toggleRightPanelBtn" onclick="toggleRightPanel()" style="background: var(--control-bg); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; cursor: pointer;">📋</button>
    </div>

    <div class="grid" id="mainGrid">
        <div class="charts-wrapper" id="chartsWrapper" ondragover="allowDrop(event)" ondrop="dropOnWrapper(event)">
            <div class="charts-grid" id="chartsContainer"></div>
        </div>

        <div class="splitter" id="dragSplitter"></div>

        <div class="verdict-card">
            <div class="verdict-header">
                <h3>Verdicts</h3>
                <div class="verdict-filters">
                    <select id="categoryFilterSelect" onchange="handleVerdictFilterChange()" style="padding: 3px 6px; font-size: 11px;">
                        <option value="all" selected>All Categories</option>
                    </select>
                    <select id="impactFilterSelect" onchange="handleVerdictFilterChange()" style="padding: 3px 6px; font-size: 11px;">
                        <option value="all" selected>All Impacts</option>
                    </select>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Application</th>
                            <th>Category</th>
                            <th>Impact</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="verdictTableBody">
                    </tbody>
                </table>
            </div>
            <div class="verdict-details-panel" id="verdictDetailsPanel">
                <div class="verdict-details-header">
                    <span id="verdictDetailsTitle">Verdict Details</span>
                    <button type="button" class="verdict-details-close" onclick="hideVerdictDetails()" title="Close details">✕</button>
                </div>
                <div class="verdict-details-body" id="verdictDetailsBody"></div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_SERIES_COLOR = '#f83838';

        // Top-down filter pipeline state:
        // Stage 1: Kind -> Stage 2: Dimension -> Stage 3: Application -> Stage 4: Host
        let currentKindFilter = 'all';
        let currentDimensionFilter = 'all';
        let currentFilter = document.getElementById('applicationSearch').value.trim();
        let currentHostFilter = document.getElementById('hostSearch').value.trim();
        let updateFreqSec = 3;
        let maxDataPoints = Math.floor(180 / updateFreqSec);
        const charts = {};
        let ws = null;
        let isPaused = false;

        const applicationCache = {};
        const hostCache = {};
        // kindName -> Set of dimension values
        const kindDimensionsMap = {};
        // dimensionValue -> { kinds: Set, apps: Set, hosts: Set }
        const dimensionEntitiesMap = {};
        let availableApplications = [];
        let selectedTimeLabel = null;
        let selectedVerdictRecord = null;
        let hoveredIndex = null;
        let chartHighlightStates = {};
        const appColorMap = {};

        let appDebounceTimer = null;
        let hostDebounceTimer = null;

        function hasSpecificKindOrDimensionSelected() {
            return currentKindFilter !== 'all' || currentDimensionFilter !== 'all';
        }

        function isAppFilterProvided() {
            return Boolean(currentFilter && currentFilter.trim() !== '');
        }

        function getVerdictRecordKey(v) {
            if (!v) return '';
            const app = v.app || '';
            const ts = v.fullTimestamp || v.time || '';
            const name = (v.verdict && v.verdict.name) ? v.verdict.name : '';
            return app + '::' + ts + '::' + name;
        }

        function formatVerdictFieldValue(val) {
            if (val === null || val === undefined || val === '') return '-';
            if (typeof val === 'object') {
                try {
                    return JSON.stringify(val, null, 2);
                } catch (e) {
                    return String(val);
                }
            }
            return String(val);
        }

        function renderVerdictDetails(verdictEntry) {
            const panel = document.getElementById('verdictDetailsPanel');
            const body = document.getElementById('verdictDetailsBody');
            const title = document.getElementById('verdictDetailsTitle');
            if (!panel || !body) return;

            if (!verdictEntry || !verdictEntry.verdict) {
                panel.classList.remove('visible');
                body.innerHTML = '';
                return;
            }

            const vv = verdictEntry.verdict;
            if (title) {
                title.textContent = (verdictEntry.app || 'Unknown');
            }

            const fields = [
                { key: 'Time', value: verdictEntry.time }
            ];

            if (verdictEntry.fullTimestamp && String(verdictEntry.fullTimestamp) !== String(verdictEntry.time)) {
                fields.push({ key: 'Timestamp', value: verdictEntry.fullTimestamp });
            }

            const preferredOrder = ['name', 'description', 'category', 'impact', 'score'];
            const seenKeys = new Set();

            preferredOrder.forEach(k => {
                if (Object.prototype.hasOwnProperty.call(vv, k)) {
                    fields.push({ key: k, value: vv[k] });
                    seenKeys.add(k);
                }
            });

            Object.keys(vv).forEach(k => {
                if (!seenKeys.has(k)) {
                    fields.push({ key: k, value: vv[k] });
                }
            });

            body.innerHTML = '';
            fields.forEach(item => {
                const keyEl = document.createElement('div');
                keyEl.className = 'verdict-detail-key';
                keyEl.textContent = item.key + ':';

                const valEl = document.createElement('div');
                valEl.className = 'verdict-detail-val';
                valEl.textContent = formatVerdictFieldValue(item.value);

                body.appendChild(keyEl);
                body.appendChild(valEl);
            });

            panel.classList.add('visible');
        }

        function hideVerdictDetails() {
            selectedTimeLabel = null;
            selectedVerdictRecord = null;
            document.querySelectorAll('#verdictTableBody tr').forEach(tr => tr.classList.remove('selected'));
            renderVerdictDetails(null);
            for (const key in charts) { redrawChart(key); }
        }

        function ensureDimensionEntry(dimVal) {
            if (!dimensionEntitiesMap[dimVal]) {
                dimensionEntitiesMap[dimVal] = {
                    kinds: new Set(),
                    apps: new Set(),
                    hosts: new Set()
                };
            }
            return dimensionEntitiesMap[dimVal];
        }

        function getAllowedDimensionsForCurrentKind() {
            const allowed = new Set();
            if (currentKindFilter === 'all') {
                Object.values(kindDimensionsMap).forEach(dimSet => {
                    dimSet.forEach(d => allowed.add(d));
                });
                Object.keys(dimensionEntitiesMap).forEach(d => allowed.add(d));
            } else if (kindDimensionsMap[currentKindFilter]) {
                kindDimensionsMap[currentKindFilter].forEach(d => allowed.add(d));
            }
            return allowed;
        }

        function registerKindAndDimension(kindName, dimValues, appIdent, hostIdent) {
            const cleanKind = (kindName !== undefined && kindName !== null) ? String(kindName).trim() : '';
            const dims = Array.isArray(dimValues)
                ? dimValues.map(d => (d !== undefined && d !== null) ? String(d).trim() : '').filter(Boolean)
                : ((dimValues !== undefined && dimValues !== null && String(dimValues).trim() !== '')
                    ? [String(dimValues).trim()]
                    : []);

            if (cleanKind && !kindDimensionsMap[cleanKind]) {
                kindDimensionsMap[cleanKind] = new Set();
            }

            dims.forEach(d => {
                if (cleanKind) {
                    kindDimensionsMap[cleanKind].add(d);
                }
                const dimEntry = ensureDimensionEntry(d);
                if (cleanKind) dimEntry.kinds.add(cleanKind);
                if (appIdent) dimEntry.apps.add(appIdent);
                if (hostIdent) dimEntry.hosts.add(hostIdent);
            });
        }

        function ingestKindDimensionPayload(payload, appIdent, hostIdent) {
            if (!payload || typeof payload !== 'object') {
                return false;
            }
            const prevKinds = Object.keys(kindDimensionsMap).sort().join('|');
            const prevDims = Object.keys(dimensionEntitiesMap).sort().join('|');

            if (payload.kind !== undefined && payload.kind !== null) {
                if (typeof payload.kind === 'string') {
                    const dimVal = payload.dimension ?? payload.value ?? null;
                    registerKindAndDimension(payload.kind, dimVal, appIdent, hostIdent);
                } else if (typeof payload.kind === 'object' && !Array.isArray(payload.kind)) {
                    const kName = payload.kind.name ?? payload.kind.kind ?? payload.kind.key ?? '';
                    const dimVals = payload.kind.values ?? payload.kind.dimensions ?? payload.kind.dimension ?? payload.dimension ?? payload.value ?? null;
                    registerKindAndDimension(kName, dimVals, appIdent, hostIdent);
                } else if (Array.isArray(payload.kind)) {
                    payload.kind.forEach(item => {
                        if (typeof item === 'string') {
                            registerKindAndDimension(item, payload.dimension ?? payload.value ?? null, appIdent, hostIdent);
                        } else if (item && typeof item === 'object') {
                            const kName = item.name ?? item.kind ?? item.key ?? '';
                            const dimVals = item.values ?? item.dimensions ?? item.dimension ?? item.value ?? null;
                            registerKindAndDimension(kName, dimVals, appIdent, hostIdent);
                        }
                    });
                }
            }

            if (payload.kinds) {
                if (Array.isArray(payload.kinds)) {
                    payload.kinds.forEach(item => {
                        if (typeof item === 'string') {
                            registerKindAndDimension(item, payload.dimension ?? null, appIdent, hostIdent);
                        } else if (item && typeof item === 'object') {
                            const kName = item.name ?? item.kind ?? item.key ?? '';
                            const dimVals = item.values ?? item.dimensions ?? item.dimension ?? item.value ?? null;
                            registerKindAndDimension(kName, dimVals, appIdent, hostIdent);
                        }
                    });
                } else if (typeof payload.kinds === 'object') {
                    Object.entries(payload.kinds).forEach(([kName, dimVals]) => {
                        registerKindAndDimension(kName, dimVals, appIdent, hostIdent);
                    });
                }
            }

            if (!payload.kind && !payload.kinds && (payload.dimension !== undefined || payload.dimensions !== undefined)) {
                const rawDims = payload.dimensions !== undefined ? payload.dimensions : payload.dimension;
                registerKindAndDimension('', rawDims, appIdent, hostIdent);
            }

            const nextKinds = Object.keys(kindDimensionsMap).sort().join('|');
            const nextDims = Object.keys(dimensionEntitiesMap).sort().join('|');
            return prevKinds !== nextKinds || prevDims !== nextDims;
        }

        function updateKindAndDimensionComboboxes() {
            const kindSelect = document.getElementById('kindSelect');
            const dimSelect = document.getElementById('dimensionSelect');
            if (!kindSelect || !dimSelect) return;

            const sortedKinds = Object.keys(kindDimensionsMap).sort((a, b) => a.localeCompare(b));
            if (currentKindFilter !== 'all' && !kindDimensionsMap[currentKindFilter]) {
                currentKindFilter = 'all';
            }

            kindSelect.innerHTML = '<option value="all">All Kinds</option>';
            sortedKinds.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                kindSelect.appendChild(opt);
            });
            kindSelect.value = currentKindFilter;

            const availableDimsSet = getAllowedDimensionsForCurrentKind();
            const sortedDims = Array.from(availableDimsSet).sort((a, b) => a.localeCompare(b));

            if (currentDimensionFilter !== 'all' && !availableDimsSet.has(currentDimensionFilter)) {
                currentDimensionFilter = 'all';
            }

            dimSelect.innerHTML = '<option value="all">All Dimensions</option>';
            sortedDims.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                dimSelect.appendChild(opt);
            });
            dimSelect.value = currentDimensionFilter;
        }

        function clearAppAndHostFilters() {
            currentFilter = '';
            currentHostFilter = '';
            const appInput = document.getElementById('applicationSearch');
            const hostInput = document.getElementById('hostSearch');
            if (appInput) appInput.value = '';
            if (hostInput) {
                hostInput.value = '';
                hostInput.setAttribute('placeholder', 'Search host or regex (e.g. host.*)...');
            }
        }

        function pruneDownstreamAppAndHostFilters() {
            if (!hasSpecificKindOrDimensionSelected()) {
                clearAppAndHostFilters();
                return;
            }

            const allowedApps = getAppsInCurrentKindAndDimension();
            if (currentFilter && allowedApps.length > 0 && !allowedApps.some(app => matchesFilter(app, currentFilter))) {
                currentFilter = '';
                const appInput = document.getElementById('applicationSearch');
                if (appInput) appInput.value = '';
            }

            const allowedHosts = getHostsInCurrentKindDimensionAndApps(allowedApps);
            if (currentHostFilter && allowedHosts.length > 0 && !allowedHosts.some(h => matchesFilter(h, currentHostFilter))) {
                currentHostFilter = '';
                const hostInput = document.getElementById('hostSearch');
                if (hostInput) hostInput.value = '';
            }
        }

        function handleKindChange() {
            currentKindFilter = document.getElementById('kindSelect').value || 'all';
            updateKindAndDimensionComboboxes();
            pruneDownstreamAppAndHostFilters();
            syncHostInputWithAppFilter();
            applyFilterPipeline();
        }

        function handleDimensionChange() {
            currentDimensionFilter = document.getElementById('dimensionSelect').value || 'all';
            updateKindAndDimensionComboboxes();
            pruneDownstreamAppAndHostFilters();
            syncHostInputWithAppFilter();
            applyFilterPipeline();
        }

        function syncHostInputWithAppFilter() {
            const hostInput = document.getElementById('hostSearch');
            if (!hostInput) return;

            if (!isAppFilterProvided()) {
                currentHostFilter = '';
                hostInput.value = '';
                hostInput.setAttribute('placeholder', 'Search host or regex (e.g. host.*)...');
                return;
            }

            const appsAfterStage3 = getAppsFilteredThroughStage3();
            const hostsInScope = getHostsInCurrentKindDimensionAndApps(appsAfterStage3).sort((a, b) => a.localeCompare(b));

            if (currentHostFilter && hostsInScope.length > 0 && !hostsInScope.some(h => matchesFilter(h, currentHostFilter))) {
                currentHostFilter = '';
                hostInput.value = '';
            }

            if (hostsInScope.length > 0) {
                hostInput.setAttribute('placeholder', hostsInScope.join(', '));
            } else {
                hostInput.setAttribute('placeholder', 'No hosts for matched apps');
            }
        }

        function handleApplicationSearchInput() {
            clearTimeout(appDebounceTimer);
            const appInput = document.getElementById('applicationSearch');
            currentFilter = appInput ? appInput.value.trim() : '';
            syncHostInputWithAppFilter();
            applyFilterPipeline();
            appDebounceTimer = setTimeout(() => {
                handleApplicationFilterChange();
            }, 150);
        }

        function handleApplicationFilterChange() {
            clearTimeout(appDebounceTimer);
            const appInput = document.getElementById('applicationSearch');
            currentFilter = appInput ? appInput.value.trim() : '';

            syncHostInputWithAppFilter();
            applyFilterPipeline();

        function handleHostSearchInput() {

        function handleHostFilterChange() {

        function handleTopToggleChange() {
            const top5Enabled = document.getElementById('top5FilterToggle') ? document.getElementById('top5FilterToggle').checked : true;
            localStorage.setItem('top5FilterEnabled', top5Enabled);
            applyFilterPipeline();
        }

        function appMatchesKindAndDimension(app) {
            if (currentDimensionFilter !== 'all') {
                if (currentKindFilter !== 'all') {
                    const dimsForKind = kindDimensionsMap[currentKindFilter];
                    if (!dimsForKind || !dimsForKind.has(currentDimensionFilter)) return false;
                }
                const dimEntry = dimensionEntitiesMap[currentDimensionFilter];
                if (!dimEntry) return false;
                return dimEntry.apps.has(app);
            }
            if (currentKindFilter !== 'all') {
                const dimsForKind = kindDimensionsMap[currentKindFilter];
                if (!dimsForKind || dimsForKind.size === 0) return true;
                let hasAnyMappedAppForKind = false;
                for (const d of dimsForKind) {
                    const dimEntry = dimensionEntitiesMap[d];
                    if (dimEntry && dimEntry.apps.size > 0) {
                        hasAnyMappedAppForKind = true;
                        if (dimEntry.apps.has(app)) return true;
                    }
                }
                return !hasAnyMappedAppForKind;
            }
            return true;
        }

        function hostMatchesKindAndDimension(host) {
            if (currentDimensionFilter !== 'all') {
                if (currentKindFilter !== 'all') {
                    const dimsForKind = kindDimensionsMap[currentKindFilter];
                    if (!dimsForKind || !dimsForKind.has(currentDimensionFilter)) return false;
                }
                const dimEntry = dimensionEntitiesMap[currentDimensionFilter];
                if (!dimEntry) return false;
                if (dimEntry.hosts.has(host)) return true;
                for (const app of dimEntry.apps) {
                    if (applicationCache[app] && applicationCache[app].hosts && applicationCache[app].hosts.has(host)) {
                        return true;
                    }
                }
                return false;
            }
            if (currentKindFilter !== 'all') {
                const dimsForKind = kindDimensionsMap[currentKindFilter];
                if (!dimsForKind || dimsForKind.size === 0) return true;
                let hasAnyMappedHostForKind = false;
                for (const d of dimsForKind) {
                    const dimEntry = dimensionEntitiesMap[d];
                    if (dimEntry) {
                        if (dimEntry.hosts.size > 0) {
                            hasAnyMappedHostForKind = true;
                            if (dimEntry.hosts.has(host)) return true;
                        } else if (dimEntry.apps.size > 0) {
                            for (const app of dimEntry.apps) {
                                if (applicationCache[app] && applicationCache[app].hosts && applicationCache[app].hosts.has(host)) {
                                    hasAnyMappedHostForKind = true;
                                    return true;
                                }
                            }
                        }
                    }
                }
                return !hasAnyMappedHostForKind;
            }
            return true;
        }

        function getChartHighlightState(metricKey) {
            if (!chartHighlightStates[metricKey]) {
                chartHighlightStates[metricKey] = { high: true, low: true };
            }
            return chartHighlightStates[metricKey];
        }

        function saveChartHighlightStates() {
            localStorage.setItem('chartHighlightStates', JSON.stringify(chartHighlightStates));
        }

        function toggleChartHighlight(metricKey, type, isChecked) {
            const state = getChartHighlightState(metricKey);
            state[type] = isChecked;
            saveChartHighlightStates();
            if (charts[metricKey]) {
                charts[metricKey].update('none');
            }
        }

        const defaultOrderedMetrics = [
            "InRequests", "OutRequests",
            "InLatency", "OutLatency",
            "InErrors", "OutErrors",
            "InThroughput", "OutThroughput",
            "ApplicationCPU", "ApplicationMemory",
            "HostCPU", "HostMemory",
        ];

        let orderedMetrics = [...defaultOrderedMetrics];
        let maximizedChartKey = null;

        const metricsConfig = {
            "InRequests": { label: "In Requests" },
            "InThroughput": { label: "In Throughput" },
            "InLatency": { label: "In Latency" },
            "InErrors": { label: "In Errors" },
            "OutRequests": { label: "Out Requests" },
            "OutThroughput": { label: "Out Throughput" },
            "OutLatency": { label: "Out Latency" },
            "OutErrors": { label: "Out Errors" },
            "ApplicationCPU": { label: "Application CPU" },
            "ApplicationMemory": { label: "Application Memory" },
            "HostCPU": { label: "Host CPU", isHost: true },
            "HostMemory": { label: "Host Memory", isHost: true },
        };

        function isHostMetric(key) {
            return Boolean(metricsConfig[key] && metricsConfig[key].isHost);
        }

        function ensureAppCache(ident) {
            if (!applicationCache[ident]) {
                applicationCache[ident] = { rawSeries: {}, verdicts: [], hosts: new Set() };
            } else if (!applicationCache[ident].hosts) {
                applicationCache[ident].hosts = new Set();
            }
        }

        function ensureHostCache(hostIdent) {
            if (!hostCache[hostIdent]) {
                hostCache[hostIdent] = { rawSeries: {}, apps: new Set() };
            } else if (!hostCache[hostIdent].apps) {
                hostCache[hostIdent].apps = new Set();
            }
        }

        function matchesFilter(name, filterVal) {
            if (!filterVal) return true;
            try {
                const regex = new RegExp(filterVal, 'i');
                return regex.test(name);
            } catch (e) {
                return name.toLowerCase().includes(filterVal.toLowerCase());
            }
        }

        function getActiveVerdictFilters() {
            const catEl = document.getElementById('categoryFilterSelect');
            const impEl = document.getElementById('impactFilterSelect');
            return {
                category: catEl ? (catEl.value || 'all') : 'all',
                impact: impEl ? (impEl.value || 'all') : 'all'
            };
        }

        function isVerdictFilterActive() {
            const { category, impact } = getActiveVerdictFilters();
            return category !== 'all' || impact !== 'all';
        }

        function getVerdictWindowCutoff(appList) {
            const totalWindowSec = parseInt(document.getElementById('timeframeSelect').value) || 60;
            const windowMs = totalWindowSec * 1000;
            let latestTime = 0;

            appList.forEach(app => {
                const appObj = applicationCache[app];
                if (!appObj) return;
                if (appObj.verdicts) {
                    appObj.verdicts.forEach(v => {
                        const t = new Date(v.fullTimestamp || v.time).getTime();
                        if (!isNaN(t) && t > latestTime) latestTime = t;
                    });
                }
                if (appObj.rawSeries) {
                    Object.values(appObj.rawSeries).forEach(series => {
                        series.forEach(pt => {
                            const t = new Date(pt.fullTimestamp || pt.time).getTime();
                            if (!isNaN(t) && t > latestTime) latestTime = t;
                        });
                    });
                }
            });

            if (latestTime === 0) {
                latestTime = Date.now();
            }
            return latestTime - windowMs;
        }

        function verdictMatchesCategoryAndImpact(verdictObj, categoryFilterVal, impactFilterVal) {
            if (!verdictObj || !verdictObj.verdict) return false;
            const category = (verdictObj.verdict.category !== undefined && verdictObj.verdict.category !== null)
                ? String(verdictObj.verdict.category).trim() : '';
            const impact = (verdictObj.verdict.impact !== undefined && verdictObj.verdict.impact !== null)
                ? String(verdictObj.verdict.impact).trim() : '';

            const matchesCategory = (categoryFilterVal === 'all' || category === categoryFilterVal);
            const matchesImpact = (impactFilterVal === 'all' || impact === impactFilterVal);
            return matchesCategory && matchesImpact;
        }

        function verdictMatchesHostAndKindDimension(verdictObj, app) {
            const vv = verdictObj && verdictObj.verdict ? verdictObj.verdict : {};
            const verdictHost = verdictObj.host || vv.host || null;

            if (currentHostFilter) {
                if (verdictHost) {
                    if (!matchesFilter(verdictHost, currentHostFilter) || !hostMatchesKindAndDimension(verdictHost)) {
                        return false;
                    }
                } else {
                    const appObj = applicationCache[app];
                    let matchedHost = false;
                    if (appObj && appObj.hosts) {
                        for (const h of appObj.hosts) {
                            if (hostMatchesKindAndDimension(h) && matchesFilter(h, currentHostFilter)) {
                                matchedHost = true;
                                break;
                            }
                        }
                    }
                    if (!matchedHost) {
                        for (const [h, hObj] of Object.entries(hostCache)) {
                            if (hObj && hObj.apps && hObj.apps.has(app) && hostMatchesKindAndDimension(h) && matchesFilter(h, currentHostFilter)) {
                                matchedHost = true;
                                break;
                            }
                        }
                    }
                    if (!matchedHost) return false;
                }
            } else if (verdictHost && !hostMatchesKindAndDimension(verdictHost)) {
                return false;
            }

            const vKind = verdictObj.kind || vv.kind || null;
            const vDim = verdictObj.dimension || vv.dimension || null;
            if (currentKindFilter !== 'all' && vKind && String(vKind).trim() !== currentKindFilter) {
                return false;
            }
            if (currentDimensionFilter !== 'all' && vDim && String(vDim).trim() !== currentDimensionFilter) {
                return false;
            }

            return true;
        }

        function appMatchesVerdictFilters(app, cutoffTime) {
            const { category, impact } = getActiveVerdictFilters();
            if (category === 'all' && impact === 'all') {
                return true;
            }

            const appObj = applicationCache[app];
            if (!appObj || !Array.isArray(appObj.verdicts) || appObj.verdicts.length === 0) {
                return false;
            }

            return appObj.verdicts.some(v => {
                const verdictTime = new Date(v.fullTimestamp || v.time).getTime();
                if (!isNaN(verdictTime) && verdictTime < cutoffTime) return false;
                if (!verdictMatchesCategoryAndImpact(v, category, impact)) return false;
                return verdictMatchesHostAndKindDimension(v, app);
            });
        }

        function getAllKnownApps() {
            const appsSet = new Set(Object.keys(applicationCache));
            availableApplications.forEach(a => appsSet.add(a));
            return Array.from(appsSet);
        }

        function getAllKnownHosts() {
            const hostsSet = new Set(Object.keys(hostCache));
            Object.values(applicationCache).forEach(appObj => {
                if (appObj && appObj.hosts) {
                    appObj.hosts.forEach(h => hostsSet.add(h));
                }
            });
            return Array.from(hostsSet);
        }

        function getAppsInCurrentKindAndDimension() {
            return getAllKnownApps().filter(app => appMatchesKindAndDimension(app));
        }

        function getAppsFilteredThroughStage3() {
            if (!isAppFilterProvided()) return [];
            const stage12Apps = getAppsInCurrentKindAndDimension();
            const cutoffTime = getVerdictWindowCutoff(stage12Apps);
            return stage12Apps.filter(app => {
                if (!matchesFilter(app, currentFilter)) return false;
                if (!appMatchesVerdictFilters(app, cutoffTime)) return false;
                return true;
            });
        }

        function getHostsInCurrentKindDimensionAndApps(appList) {
            const hostsSet = new Set();
            const targetApps = Array.isArray(appList) ? appList : getAppsFilteredThroughStage3();

            targetApps.forEach(app => {
                const appObj = applicationCache[app];
                if (appObj && appObj.hosts) {
                    appObj.hosts.forEach(h => {
                        if (hostMatchesKindAndDimension(h)) {
                            hostsSet.add(h);
                        }
                    });
                }
            });

            Object.entries(hostCache).forEach(([h, hObj]) => {
                if (!hostMatchesKindAndDimension(h)) return;
                if (hObj && hObj.apps) {
                    for (const app of targetApps) {
                        if (hObj.apps.has(app)) {
                            hostsSet.add(h);
                            break;
                        }
                    }
                }
            });

            if (hostsSet.size === 0 && targetApps.length === 0 && !currentFilter && currentDimensionFilter === 'all' && currentKindFilter === 'all') {
                getAllKnownHosts().forEach(h => {
                    if (hostMatchesKindAndDimension(h)) hostsSet.add(h);
                });
            }

            return Array.from(hostsSet);
        }

        function getFinalFilteredHosts() {
            if (!isAppFilterProvided()) return [];
            const stage3Apps = getAppsFilteredThroughStage3();
            const candidateHosts = getHostsInCurrentKindDimensionAndApps(stage3Apps);
            return candidateHosts.filter(h => matchesFilter(h, currentHostFilter));
        }

        function getMatchingApps() {
            if (!isAppFilterProvided()) return [];
            const stage3Apps = getAppsFilteredThroughStage3();
            if (!currentHostFilter) {
                return stage3Apps;
            }

            const allowedHostsSet = new Set(getFinalFilteredHosts());
            return stage3Apps.filter(app => {
                const appObj = applicationCache[app];
                if (appObj && appObj.hosts) {
                    for (const h of appObj.hosts) {
                        if (allowedHostsSet.has(h)) return true;
                    }
                }
                for (const h of allowedHostsSet) {
                    if (hostCache[h] && hostCache[h].apps && hostCache[h].apps.has(app)) {
                        return true;
                    }
                }
                return false;
            });
        }

        function getMatchingHosts() {
            return getFinalFilteredHosts();
        }

        function limitToTopN(entityList, cacheObj, metricKey, limit = 5) {
            const top5Enabled = document.getElementById('top5FilterToggle') ? document.getElementById('top5FilterToggle').checked : true;
            const effectiveLimit = top5Enabled ? limit : entityList.length;
            if (entityList.length <= effectiveLimit) return [...entityList];

            return [...entityList].sort((a, b) => {
                const seriesA = cacheObj[a] && cacheObj[a].rawSeries[metricKey] ? cacheObj[a].rawSeries[metricKey] : [];
                const seriesB = cacheObj[b] && cacheObj[b].rawSeries[metricKey] ? cacheObj[b].rawSeries[metricKey] : [];

                const latestA = seriesA.length > 0 ? (seriesA[seriesA.length - 1].val || 0) : 0;
                const latestB = seriesB.length > 0 ? (seriesB[seriesB.length - 1].val || 0) : 0;

                return latestB - latestA;
            }).slice(0, effectiveLimit);
        }

        function updateFilterLists() {
            updateKindAndDimensionComboboxes();

            const appDatalist = document.getElementById('applicationList');
            const hostDatalist = document.getElementById('hostList');
            if (!appDatalist || !hostDatalist) return;

            const stage12Apps = getAppsInCurrentKindAndDimension();
            const cutoffTime = getVerdictWindowCutoff(stage12Apps);
            let appCandidates = stage12Apps.filter(app =>
                appMatchesVerdictFilters(app, cutoffTime)
            ).sort((a, b) => a.localeCompare(b));
            if (!isAppFilterProvided()) {
                appCandidates = limitToTopN(appCandidates, applicationCache, 'InRequests', 5);
            }

            appDatalist.innerHTML = '';
            appCandidates.forEach(app => {
                const opt = document.createElement('option');
                opt.value = app;
                appDatalist.appendChild(opt);
            });

            // Fulfill host filter options according to applications matched by app filter
            let hostCandidates = [];
            if (isAppFilterProvided()) {
                const stage3Apps = getAppsFilteredThroughStage3();
                hostCandidates = getHostsInCurrentKindDimensionAndApps(stage3Apps).sort((a, b) => a.localeCompare(b));
            } else {
                const allHosts = getHostsInCurrentKindDimensionAndApps(stage12Apps).sort((a, b) => a.localeCompare(b));
                hostCandidates = limitToTopN(allHosts, hostCache, 'HostCPU', 5);
            }

            hostDatalist.innerHTML = '';
            hostCandidates.forEach(host => {
                const opt = document.createElement('option');
                opt.value = host;
                hostDatalist.appendChild(opt);
            });
        }

        function hasHostDataForMatchingApps() {
            if (!isAppFilterProvided()) return false;
            const matchingHosts = getMatchingHosts();
            return matchingHosts.some(h => {
                const hc = hostCache[h];
                if (!hc || !hc.rawSeries) return false;
                return Object.keys(hc.rawSeries).some(m => hc.rawSeries[m] && hc.rawSeries[m].length > 0);
            });
        }

        function getEntitiesForChart(key) {
            if (!isAppFilterProvided()) {
                return {
                    entities: [],
                    cache: isHostMetric(key) ? hostCache : applicationCache
                };
            }

            if (isHostMetric(key)) {
                const hosts = getMatchingHosts();
                return {
                    entities: limitToTopN(hosts, hostCache, key, 5),
                    cache: hostCache
                };
            }

            const apps = getMatchingApps();
            return {
                entities: limitToTopN(apps, applicationCache, key, 5),
                cache: applicationCache
            };
        }

        function getRandomColor(entityName) {
            if (appColorMap[entityName]) return appColorMap[entityName];
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            appColorMap[entityName] = color;
            return color;
        }

        async function fetchApplications() {
            if (isPaused) return;
            try {
                const res = await fetch('{{.ListPath}}');
                if (isPaused) return;
                const data = await res.json();
                if (isPaused) return;
                if (data && data.applications) {
                    availableApplications = Object.keys(data.applications);
                    availableApplications.forEach(key => {
                        ensureAppCache(key);
                        const appMeta = data.applications[key];
                        if (appMeta && Array.isArray(appMeta.hosts)) {
                            appMeta.hosts.forEach(h => {
                                ensureHostCache(h);
                                applicationCache[key].hosts.add(h);
                                hostCache[h].apps.add(key);
                            });
                        }
                        if (appMeta && typeof appMeta === 'object') {
                            ingestKindDimensionPayload(appMeta, key, null);
                        }
                    });
                }

                const activeRes = await fetch('{{.ActivePath}}');
                if (isPaused) return;
                const activeData = await activeRes.json();
                if (isPaused) return;
                if (activeData) {
                    ingestKindDimensionPayload(activeData, activeData.application || null, activeData.host || null);

                    if (hasSpecificKindOrDimensionSelected()) {
                        if (activeData.application && !currentFilter) {
                            currentFilter = activeData.application;
                            document.getElementById('applicationSearch').value = currentFilter;
                        }
                        if (activeData.host && !currentHostFilter) {
                            currentHostFilter = activeData.host;
                            document.getElementById('hostSearch').value = currentHostFilter;
                        }
                    }
                }
                syncHostInputWithAppFilter();
                updateFilterLists();
            } catch(err) {
                console.error("Failed to load applications from API", err);
            }
        }

            document.body.className = '';
            localStorage.setItem('selectedTheme', theme);
            if (theme) {
                document.body.classList.add('theme-' + theme);
            }
        }

            document.getElementById('themeSelect').value = savedTheme;

                if (toggle) toggle.checked = (savedTop5 === 'true');

            if (savedChartHighlights) {
                try {

                    if (parsed && typeof parsed === 'object') {
                        chartHighlightStates = parsed;
                    }
                } catch(e) {}
            }

            if (savedOrder) {
                try {
                    const parsed = JSON.parse(savedOrder);
                    if (Array.isArray(parsed) && parsed.length === defaultOrderedMetrics.length) {
                        orderedMetrics = parsed;
                    }

        const splitter = document.getElementById('dragSplitter');
        const mainGrid = document.getElementById('mainGrid');

        splitter.addEventListener('mousedown', (e) => {
            isDragging = true;
            splitter.classList.add('dragging');

            e.preventDefault();

        window.addEventListener('mousemove', (e) => {

            const gridRect = mainGrid.getBoundingClientRect();

        window.addEventListener('DOMContentLoaded', () => {

            if (savedWidth && !localStorage.getItem('isPanelCollapsed')) {
                mainGrid.style.gridTemplateColumns = 'minmax(0, 1fr) 8px ' + savedWidth + 'px';

        const correlationLinePlugin = {
            id: 'correlationLinePlugin',
            afterDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const dataset = chart.data.datasets[0];
                if (!dataset) return;

                ctx.save();

                const metricKey = chart.canvas.id.replace('chart_', '');
                const { high: showHighHighlight, low: showLowHighlight } = getChartHighlightState(metricKey);
                const { entities } = getEntitiesForChart(metricKey);
                const multiMode = entities.length > 1;

                let violationTypes = [];
                const numEntities = multiMode ? entities.length : 1;
                const upDataset = chart.data.datasets.find(ds => ds.label === 'Upper');
                const loDataset = chart.data.datasets.find(ds => ds.label === 'Lower');

                if (upDataset && loDataset && chart.data.labels.length > 0 && (showHighHighlight || showLowHighlight)) {
                    for (let i = 0; i < chart.data.labels.length; i++) {
                        let hasHigh = false;
                        let hasLow = false;
                        for (let d = 0; d < numEntities; d++) {
                            if (!chart.data.datasets[d]) continue;
                            const val = chart.data.datasets[d].data[i];
                            const up = upDataset.data[i];
                            const lo = loDataset.data[i];
                            if (val !== null && val !== undefined) {
                                if (up !== null && up !== undefined && val > up) hasHigh = true;
                                if (lo !== null && lo !== undefined && val < lo) hasLow = true;
                            }
                        }
                        if (hasHigh && showHighHighlight) violationTypes.push('high');
                        else if (hasLow && showLowHighlight) violationTypes.push('low');
                        else violationTypes.push(null);
                    }
                }

                if (violationTypes.length > 0) {
                    const top = chart.chartArea.top;
                    const bottom = chart.chartArea.bottom;
                    const meta = chart.getDatasetMeta(0);

                    let startX = null;
                    let endX = null;
                    let currentType = null;

                    meta.data.forEach((element, index) => {
                        const vType = violationTypes[index];
                        if (vType) {
                            const x = element.x;
                            if (startX === null) {
                                startX = x - 12;
                                currentType = vType;
                            } else if (currentType !== vType) {
                                drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                                startX = x - 12;
                                currentType = vType;
                            }
                            endX = x + 12;
                        } else {
                            if (startX !== null) {
                                drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                                startX = null;
                                endX = null;
                                currentType = null;
                            }
                        }
                    });

                    if (startX !== null) {
                        drawViolationRect(ctx, startX, endX, top, bottom, currentType);
                    }
                }

                if (hoveredIndex !== null) {
                    const meta = chart.getDatasetMeta(0);
                    if (meta.data[hoveredIndex]) {
                        const x = meta.data[hoveredIndex].x;
                        const top = chart.chartArea.top;
                        const bottom = chart.chartArea.bottom;

                        ctx.strokeStyle = 'rgba(150, 150, 150, 0.8)';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.moveTo(x, top);
                        ctx.lineTo(x, bottom);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }

                ctx.restore();
            }
        };

        function drawViolationRect(ctx, startX, endX, top, bottom, type) {
            const grad = ctx.createLinearGradient(0, top, 0, bottom);
            if (type === 'high') {
                grad.addColorStop(0, 'rgba(239, 68, 68, 0.3)');
                grad.addColorStop(1, 'rgba(239, 68, 68, 0.05)');
            } else {
                grad.addColorStop(0, 'rgba(59, 130, 246, 0.05)');
                grad.addColorStop(1, 'rgba(59, 130, 246, 0.35)');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(startX, top, (endX - startX), bottom - top);
        }

        Chart.register(correlationLinePlugin);

        function syncZoom(targetChart) {
            const scale = targetChart.scales.x;
            const min = scale.min;
            const max = scale.max;

            for (const key in charts) {
                if (charts[key] !== targetChart) {
                    charts[key].options.scales.x.min = min;
                    charts[key].options.scales.x.max = max;
                    charts[key].update('none');
                }
            }
        }

        let draggedMetricKey = null;

        function handleDragStart(e) {
            draggedMetricKey = this.getAttribute('data-metric');
            this.closest('.card').classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            const card = this.closest('.card');
            if (card) card.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            const card = this.closest('.card');
            if (card) card.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            const targetCard = this.closest('.card');
            if (targetCard) targetCard.classList.remove('drag-over');

            const targetMetricKey = this.getAttribute('data-metric');
            if (draggedMetricKey && targetMetricKey && draggedMetricKey !== targetMetricKey) {
                const oldIdx = orderedMetrics.indexOf(draggedMetricKey);
                const newIdx = orderedMetrics.indexOf(targetMetricKey);
                if (oldIdx > -1 && newIdx > -1) {
                    orderedMetrics.splice(oldIdx, 1);
                    orderedMetrics.splice(newIdx, 0, draggedMetricKey);
                    localStorage.setItem('chartOrder', JSON.stringify(orderedMetrics));
                    initCharts();
                }
            }
            return false;
        }

        function handleDragEnd(e) {
            document.querySelectorAll('.card').forEach(c => {
                c.classList.remove('dragging');
                c.classList.remove('drag-over');
            });
            draggedMetricKey = null;
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropOnWrapper(e) {
            e.preventDefault();
            if (draggedMetricKey) {
                const oldIdx = orderedMetrics.indexOf(draggedMetricKey);
                if (oldIdx > -1) {
                    orderedMetrics.splice(oldIdx, 1);
                    orderedMetrics.push(draggedMetricKey);
                    localStorage.setItem('chartOrder', JSON.stringify(orderedMetrics));
                    initCharts();
                }
            }
        }

        function toggleMaximize(key) {
            if (maximizedChartKey === key) {
                maximizedChartKey = null;
                localStorage.removeItem('maximizedChartKey');
            } else {
                maximizedChartKey = key;
                localStorage.setItem('maximizedChartKey', key);
            }

        }

        function buildDatasetsForChart(key) {
            const cfg = metricsConfig[key];
            const { entities } = getEntitiesForChart(key);
            const multiMode = entities.length > 1;
            let datasets = [];

            if (multiMode) {
                entities.forEach(entity => {
                    datasets.push({
                        label: entity,
                        data: [],
                        borderColor: getRandomColor(entity),
                        backgroundColor: 'transparent',
                        tension: 0.2,
                        pointRadius: 0
                    });
                });
                datasets.push(
                    { label: 'Upper', data: [], borderColor: '#ef4444', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 },
                    { label: 'Lower', data: [], borderColor: '#3b82f6', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 },
                    { label: 'Median', data: [], borderColor: '#5df63b', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 }
                );
            } else {
                const singleLabel = (entities.length === 1) ? entities[0] : cfg.label;
                datasets = [
                    { label: singleLabel, data: [], borderColor: DEFAULT_SERIES_COLOR, backgroundColor: 'transparent', tension: 0.2, _violationPoints: [], _violationTypes: [] },
                    { label: 'Upper', data: [], borderColor: '#ef4444', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 },
                    { label: 'Lower', data: [], borderColor: '#3b82f6', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 },
                    { label: 'Median', data: [], borderColor: '#5df63b', borderDash: [1, 4], backgroundColor: 'transparent', tension: 0.1, pointRadius: 0 }
                ];
            }
            return datasets;
        }

        function formatBoundaryValue(val) {
            if (val === null || val === undefined || val === '' || Number.isNaN(Number(val))) {
                return 'N/A';
            }
            return Number(val).toFixed(2);
        }

        function initCharts() {
            for (const key in charts) {
                if (charts[key]) {
                    charts[key].destroy();
                }
            }
            Object.keys(charts).forEach(k => delete charts[k]);

            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';

            const showHostCharts = hasHostDataForMatchingApps();
            if (maximizedChartKey && isHostMetric(maximizedChartKey) && !showHostCharts) {
                maximizedChartKey = null;
                localStorage.removeItem('maximizedChartKey');
            }

            const visibleMetrics = orderedMetrics.filter(key => {
                if (isHostMetric(key)) return showHostCharts;
                return true;
            });

            const keysToRender = maximizedChartKey ? [maximizedChartKey] : visibleMetrics;
            if (maximizedChartKey) {
                container.style.gridTemplateColumns = '1fr';
            } else {
                container.style.gridTemplateColumns = 'repeat(auto-fit, minmax(500px, 1fr))';
            }

            keysToRender.forEach(key => {
                const cfg = metricsConfig[key];
                const card = document.createElement('div');
                card.className = 'card' + (maximizedChartKey === key ? ' maximized' : '');
                card.id = 'card_' + key;

                const maxBtnText = (maximizedChartKey === key) ? '❐' : '🗖';
                const { high: isHighChecked, low: isLowChecked } = getChartHighlightState(key);

                const legendHtml = '' +
                    '<div class="inline-legend" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">' +
                        '<label style="color:#ef4444">' +
                            '<input type="checkbox" ' + (isHighChecked ? 'checked' : '') + ' onchange="toggleChartHighlight(\'' + key + '\', \'high\', this.checked)"> Upper' +
                        '</label>' +
                        '<label style="color:#3b82f6">' +
                            '<input type="checkbox" ' + (isLowChecked ? 'checked' : '') + ' onchange="toggleChartHighlight(\'' + key + '\', \'low\', this.checked)"> Lower' +
                        '</label>' +
                    '</div>';

                card.innerHTML = '<div class="card-header" draggable="true" data-metric="' + key + '">' +
                    '<h4>☰ ' + cfg.label + '</h4>' +
                    '<div class="header-actions">' +
                        legendHtml +
                        '<button class="maximize-btn" onclick="toggleMaximize(\'' + key + '\')">' + maxBtnText + '</button>' +
                    '</div>' +
                '</div>' +
                '<div class="chart-container"><canvas id="chart_' + key + '"></canvas></div>';

                const header = card.querySelector('.card-header');
                header.addEventListener('dragstart', handleDragStart);
                header.addEventListener('dragenter', handleDragEnter);
                header.addEventListener('dragover', handleDragOver);
                header.addEventListener('dragleave', handleDragLeave);
                header.addEventListener('drop', handleDrop);
                header.addEventListener('dragend', handleDragEnd);

                container.appendChild(card);

                const ctx = document.getElementById('chart_' + key).getContext('2d');
                const datasets = buildDatasetsForChart(key);

                charts[key] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(100, 116, 139, 0.2)' }, grace: '15%' },
                            x: { grid: { color: 'rgba(100, 116, 139, 0.2)' } }
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        onHover: (event, activeElements) => {
                            if (activeElements.length > 0) {
                                hoveredIndex = activeElements[0].index;
                            } else {
                                hoveredIndex = null;
                            }
                            for (const k in charts) {
                                charts[k].update('none');
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                filter: function() {
                                    return true;
                                },
                                itemSort: function(a, b) {
                                    const boundaryOrder = { 'Upper': -3, 'Median': -2, 'Lower': -1 };
                                    const aRank = boundaryOrder[a.dataset.label] ?? 0;
                                    const bRank = boundaryOrder[b.dataset.label] ?? 0;
                                    if (aRank !== bRank) return aRank - bRank;
                                    return (b.parsed.y || 0) - (a.parsed.y || 0);
                                },
                                callbacks: {
                                    title: function(context) {
                                        return (context && context.length > 0) ? context[0].label : '';
                                    },
                                    label: function(context) {
                                        const labelName = context.dataset.label || '';
                                        const val = context.parsed ? context.parsed.y : null;
                                        if (val === null || val === undefined || Number.isNaN(Number(val))) {
                                            return ' ' + labelName + ': N/A';
                                        }
                                        return ' ' + labelName + ': ' + Number(val).toFixed(2);
                                    },
                                    afterBody: function(context) {
                                        const chartInstance = context && context.length > 0 ? context[0].chart : null;
                                        const dataIndex = context && context.length > 0 ? context[0].dataIndex : null;
                                        const presentLabels = new Set((context || []).map(item => item.dataset && item.dataset.label));
                                        const boundaries = ['Upper', 'Lower', 'Median'];
                                        const lines = [];

                                        boundaries.forEach(bName => {
                                            if (!presentLabels.has(bName)) {
                                                let fallbackVal = null;
                                                if (chartInstance && dataIndex !== null && dataIndex !== undefined) {
                                                    const ds = chartInstance.data.datasets.find(d => d.label === bName);
                                                    if (ds && Array.isArray(ds.data)) {
                                                        fallbackVal = ds.data[dataIndex];
                                                    }
                                                }
                                                lines.push(' ' + bName + ': ' + formatBoundaryValue(fallbackVal));
                                            }
                                        });

                                        return lines;
                                    }
                                }
                            },
                            zoom: {
                                zoom: {
                                    wheel: { enabled: false },
                                    pinch: { enabled: false },
                                    mode: 'x',
                                    drag: {
                                        enabled: true,
                                        backgroundColor: 'rgba(56, 189, 248, 0.25)',
                                        borderColor: 'rgba(56, 189, 248, 0.8)',
                                        borderWidth: 1
                                    },
                                    onZoom: ({chart}) => syncZoom(chart)
                                },
                                pan: {
                                    enabled: true,
                                    mode: 'x',
                                    onPan: ({chart}) => syncZoom(chart)
                                }
                            }
                        }
                    }
                });
                redrawChart(key);
            });
        }
