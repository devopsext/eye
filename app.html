        function updateVerdictFilterOptions(appsForOptions) {
            const catSelect = document.getElementById('categoryFilterSelect');
            const impSelect = document.getElementById('impactFilterSelect');

            const currentCat = catSelect ? (catSelect.value || 'all') : 'all';
            const currentImp = impSelect ? (impSelect.value || 'all') : 'all';

            const categoriesSet = new Set();
            const impactsSet = new Set();

            appsForOptions.forEach(app => {
                if (applicationCache[app] && applicationCache[app].verdicts) {
                    applicationCache[app].verdicts.forEach(v => {
                        if (!v.verdict) return;
                        const cat = (v.verdict.category !== undefined && v.verdict.category !== null) ? String(v.verdict.category).trim() : '';
                        if (cat) categoriesSet.add(cat);

                        const imp = (v.verdict.impact !== undefined && v.verdict.impact !== null) ? String(v.verdict.impact).trim() : '';
                        if (imp) impactsSet.add(imp);
                    });
                }
            });

            if (currentCat !== 'all') categoriesSet.add(currentCat);
            if (currentImp !== 'all') impactsSet.add(currentImp);

            if (catSelect) {
                const sortedCats = Array.from(categoriesSet).sort((a, b) => a.localeCompare(b));
                catSelect.innerHTML = '<option value="all">All Categories</option>';
                sortedCats.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    catSelect.appendChild(opt);
                });
                catSelect.value = currentCat;
            }

            if (impSelect) {
                const sortedImps = Array.from(impactsSet).sort((a, b) => a.localeCompare(b));
                impSelect.innerHTML = '<option value="all">All Impacts</option>';
                sortedImps.forEach(imp => {
                    const opt = document.createElement('option');
                    opt.value = imp;
                    opt.textContent = imp;
                    impSelect.appendChild(opt);
                });
                impSelect.value = currentImp;
            }
        }

        function rebuildVerdictTable() {
            const tbody = document.getElementById('verdictTableBody');
            tbody.innerHTML = "";

            if (!isAppFilterProvided()) {
                selectedTimeLabel = null;
                selectedVerdictRecord = null;
                renderVerdictDetails(null);
                updateVerdictFilterOptions([]);
                return;
            }

            const matchedApps = getAppsInCurrentKindAndDimension().filter(app => matchesFilter(app, currentFilter));
            updateVerdictFilterOptions(matchedApps);

            const allVerdicts = [];
            const cutoffTime = getVerdictWindowCutoff(matchedApps);
            const { category: categoryFilterVal, impact: impactFilterVal } = getActiveVerdictFilters();

            matchedApps.forEach(app => {
                if (applicationCache[app] && applicationCache[app].verdicts) {
                    applicationCache[app].verdicts.forEach(v => {
                        const verdictTime = new Date(v.fullTimestamp || v.time).getTime();
                        if (!isNaN(verdictTime) && verdictTime < cutoffTime) return;
                        if (!verdictMatchesCategoryAndImpact(v, categoryFilterVal, impactFilterVal)) return;
                        if (!verdictMatchesHostAndKindDimension(v, app)) return;
                        allVerdicts.push({ app, ...v });
                    });
                }
            });

            allVerdicts.sort((a, b) => new Date(b.fullTimestamp || b.time) - new Date(a.fullTimestamp || a.time));

            const selectedKey = selectedVerdictRecord ? getVerdictRecordKey(selectedVerdictRecord) : '';
            let matchedSelectedEntry = null;

            allVerdicts.forEach(v => {
                const timeLabel = v.time;
                const vv = v.verdict;
                const categoryText = vv.category || '-';
                const impactText = vv.impact || '-';
                const rowKey = getVerdictRecordKey(v);

                let badgeImpactClass = 'text-green';
                if (vv.impact === 'severe') badgeImpactClass = 'text-red';
                else if (vv.impact === 'average') badgeImpactClass = 'text-yellow';

                let badgeCategoryClass = 'badge-green';
                if (vv.category === 'failure') badgeCategoryClass = 'badge-red';
                else if (vv.category === 'operational') badgeCategoryClass = 'badge-yellow';

                const largeHint = '• Application: ' + v.app + '\n' +
                                  '• Category: ' + vv.category + '\n' +
                                  '• Impact: ' + vv.impact + '\n' +
                                  '• Score: ' + vv.score + '\n' +
                                  '• Event Name: ' + vv.name + '\n' +
                                  '• Description:  ' + vv.description + '\n';

                const row = document.createElement('tr');
                row.setAttribute('data-time', timeLabel);
                row.setAttribute('data-verdict-key', rowKey);
                if (selectedKey && rowKey === selectedKey) {
                    row.className = 'selected';
                    matchedSelectedEntry = v;
                }

                row.title = largeHint;
                row.innerHTML = '<td>' + timeLabel + '</td>' +
                    '<td><strong>' + v.app + '</strong></td>' +
                    '<td><span class="badge ' + badgeCategoryClass + '">' + categoryText + '</span></td>' +
                    '<td><span class="badge ' + badgeImpactClass + '">' + impactText + '</span></td>' +
                    '<td>' + vv.score + '</td>';

                row.onclick = function() { selectVerdict(v, row); };
                tbody.appendChild(row);
            });

            if (matchedSelectedEntry) {
                selectedVerdictRecord = matchedSelectedEntry;
                renderVerdictDetails(matchedSelectedEntry);
            } else if (selectedKey) {
                selectedVerdictRecord = null;
                selectedTimeLabel = null;
                renderVerdictDetails(null);
            }
        }

        function applyBoundaryDatasets(c, maxUp, minLo, avgMe) {
            const upDataset = c.data.datasets.find(ds => ds.label === 'Upper');
            const loDataset = c.data.datasets.find(ds => ds.label === 'Lower');
            const meDataset = c.data.datasets.find(ds => ds.label === 'Median');

            if (upDataset) {
                upDataset.hidden = false;
                upDataset.data = maxUp;
            }
            if (loDataset) {
                loDataset.hidden = false;
                loDataset.data = minLo;
            }
            if (meDataset) {
                meDataset.hidden = false;
                meDataset.data = avgMe;
            }
        }

        function redrawChart(key) {
            const c = charts[key];
            if (!c) return;

            const { entities, cache } = getEntitiesForChart(key);
            if (!isAppFilterProvided() || entities.length === 0) {
                c.data.labels = [];
                c.data.datasets.forEach(ds => { ds.data = []; });
                c.update('none');
                return;
            }

            const multiMode = entities.length > 1;
            const expectedDatasetCount = multiMode ? (entities.length + 3) : 4;

            if (c.data.datasets.length !== expectedDatasetCount) {
                c.data.datasets = buildDatasetsForChart(key);
            }

            if (multiMode) {
                const timeSet = new Set();
                entities.forEach(entity => {
                    if (cache[entity] && cache[entity].rawSeries[key]) {
                        cache[entity].rawSeries[key].forEach(pt => timeSet.add(pt.time));
                    }
                });
                const labels = Array.from(timeSet);
                c.data.labels = labels.slice(-maxDataPoints);

                for (let i = 0; i < entities.length; i++) {
                    const entityName = entities[i];
                    const dataset = c.data.datasets[i];
                    if (!dataset) continue;

                    dataset.label = entityName;
                    dataset.borderColor = getRandomColor(entityName);

                    const series = (cache[entityName] && cache[entityName].rawSeries[key]) ? cache[entityName].rawSeries[key] : [];
                    const trimmedLabels = c.data.labels;
                    dataset.data = trimmedLabels.map(tLabel => {
                        const pt = series.find(p => p.time === tLabel);
                        return pt ? pt.val : null;
                    });

                    dataset.pointRadius = trimmedLabels.map(tLabel => (tLabel === selectedTimeLabel) ? 6 : 0);
                    dataset.pointBackgroundColor = dataset.borderColor;
                    dataset.pointBorderColor = trimmedLabels.map(tLabel => (tLabel === selectedTimeLabel) ? '#ffffff' : dataset.borderColor);
                }

                const trimmedLabels = c.data.labels;
                const maxUp = [];
                const minLo = [];
                const avgMe = [];

                trimmedLabels.forEach(tLabel => {
                    let mUp = -Infinity, mLo = Infinity, meSum = 0, count = 0, hasUp = false, hasLo = false;
                    entities.forEach(entityName => {
                        const series = (cache[entityName] && cache[entityName].rawSeries[key]) ? cache[entityName].rawSeries[key] : [];
                        const pt = series.find(p => p.time === tLabel);
                        if (pt) {
                            if (pt.up !== undefined && pt.up !== null && Number.isFinite(Number(pt.up))) {
                                mUp = Math.max(mUp, Number(pt.up));
                                hasUp = true;
                            }
                            if (pt.lo !== undefined && pt.lo !== null && Number.isFinite(Number(pt.lo))) {
                                mLo = Math.min(mLo, Number(pt.lo));
                                hasLo = true;
                            }
                            if (pt.me !== undefined && pt.me !== null && Number.isFinite(Number(pt.me))) {
                                meSum += Number(pt.me);
                                count++;
                            }
                        }
                    });
                    maxUp.push(hasUp ? mUp : null);
                    minLo.push(hasLo ? mLo : null);
                    avgMe.push(count > 0 ? meSum / count : null);
                });

                applyBoundaryDatasets(c, maxUp, minLo, avgMe);

            } else if (entities.length === 1) {
                const entityKey = entities[0];
                if (!cache[entityKey]) {
                    if (isHostMetric(key)) ensureHostCache(entityKey);
                    else ensureAppCache(entityKey);
                }
                if (!cache[entityKey].rawSeries[key]) {
                    cache[entityKey].rawSeries[key] = [];
                }
                const series = cache[entityKey].rawSeries[key];
                const trimmed = series.slice(-maxDataPoints);

                c.data.labels = trimmed.map(pt => pt.time);
                c.data.datasets[0].label = entityKey;
                c.data.datasets[0].data = trimmed.map(pt => pt.val);

                const upArr = trimmed.map(pt => (pt.up !== undefined && pt.up !== null && Number.isFinite(Number(pt.up))) ? Number(pt.up) : null);
                const loArr = trimmed.map(pt => (pt.lo !== undefined && pt.lo !== null && Number.isFinite(Number(pt.lo))) ? Number(pt.lo) : null);
                const meArr = trimmed.map(pt => (pt.me !== undefined && pt.me !== null && Number.isFinite(Number(pt.me))) ? Number(pt.me) : null);

                applyBoundaryDatasets(c, upArr, loArr, meArr);

                c.data.datasets[0]._violationTypes = trimmed.map(pt => {
                    if (pt.val > pt.up) return 'high';
                    if (pt.val < pt.lo) return 'low';
                    return null;
                });
                c.data.datasets[0]._violationPoints = trimmed.map(pt => pt.val > pt.up || pt.val < pt.lo);

                c.data.datasets[0].pointRadius = trimmed.map(pt => (pt.time === selectedTimeLabel) ? 6 : 0);
                c.data.datasets[0].pointBackgroundColor = DEFAULT_SERIES_COLOR;
                c.data.datasets[0].pointBorderColor = (pt) => (pt.time === selectedTimeLabel) ? '#ffffff' : DEFAULT_SERIES_COLOR;
            } else {
                c.data.labels = [];
                c.data.datasets.forEach(ds => { ds.data = []; });
            }

            c.update('none');
        }

        function selectVerdict(verdictEntry, rowElement) {
            const clickedKey = getVerdictRecordKey(verdictEntry);
            const currentKey = selectedVerdictRecord ? getVerdictRecordKey(selectedVerdictRecord) : '';

            if (currentKey && clickedKey === currentKey) {
                selectedTimeLabel = null;
                selectedVerdictRecord = null;
                document.querySelectorAll('#verdictTableBody tr').forEach(tr => tr.classList.remove('selected'));
                renderVerdictDetails(null);
            } else {
                selectedTimeLabel = verdictEntry.time;
                selectedVerdictRecord = verdictEntry;
                document.querySelectorAll('#verdictTableBody tr').forEach(tr => tr.classList.remove('selected'));
                rowElement.classList.add('selected');
                renderVerdictDetails(verdictEntry);
            }
            for (const key in charts) { redrawChart(key); }
        }

        function setModel(model) {
            const ms = document.getElementById('modelStatus');
            try {
                ms.innerText = 'Unknown';
                if (model) {
                    const state = model.state;
                    if (state === 'Idle') {
                        ms.innerText = model.detected.toString() + ' / ' + model.trained.toString();
                    } else if (state === 'Training') {
                        ms.innerText = 'Training...';
                    } else if (state === 'Detecting') {
                        ms.innerText = 'Detecting...';
                    }
                }
            } catch(e) {
               ms.innerText = 'Unknown';
            }
        }

        function addApplication(ident) {
            const isNew = !applicationCache[ident];
            ensureAppCache(ident);
            if (isNew) {
                updateFilterLists();
            }
        }

        function clearVerdicts() {
            const matchingApps = getMatchingApps();
            matchingApps.forEach(app => {
                if (applicationCache[app]) {
                    applicationCache[app].verdicts = [];
                }
            });
            selectedTimeLabel = null;
            selectedVerdictRecord = null;
            renderVerdictDetails(null);
            rebuildVerdictTable();
        }

        function ingestHostPoints(appIdent, hostIdent, points, timeLabel, fullTimestamp, updatedHostMetrics) {
            if (!hostIdent || !Array.isArray(points)) return false;
            ensureAppCache(appIdent);
            const isNewHost = !hostCache[hostIdent];
            ensureHostCache(hostIdent);

            const hadLink = applicationCache[appIdent].hosts.has(hostIdent);
            applicationCache[appIdent].hosts.add(hostIdent);
            hostCache[hostIdent].apps.add(appIdent);

            points.forEach(point => {
                if (!hostCache[hostIdent].rawSeries[point.metric]) {
                    hostCache[hostIdent].rawSeries[point.metric] = [];
                }
                const series = hostCache[hostIdent].rawSeries[point.metric];
                const existingIndex = series.findIndex(pt => pt.time === timeLabel);
                const pointData = {
                    time: timeLabel,
                    fullTimestamp: fullTimestamp,
                    val: point.value,
                    up: point.max,
                    lo: point.min,
                    me: point.median,
                };

                if (existingIndex > -1) {
                    series[existingIndex] = pointData;
                } else {
                    series.push(pointData);
                    if (series.length > 200) {
                        series.shift();
                    }
                }
                updatedHostMetrics.add(point.metric);
            });

            return isNewHost || !hadLink;
        }

        function sendActiveFilterToWS(socket) {
            const targetSocket = socket || ws;
            if (!isPaused && targetSocket && targetSocket.readyState === WebSocket.OPEN) {
                targetSocket.send(JSON.stringify({
                    type: 'filter',
                    kind: currentKindFilter === 'all' ? '' : currentKindFilter,
                    dimension: currentDimensionFilter === 'all' ? '' : currentDimensionFilter,
                    application: currentFilter,
                    host: currentHostFilter
                }));
            }
        }

        function connectWS() {
            if (isPaused) return;
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            const loc = window.location;
            const wsProtocol = loc.protocol === 'https:' ? 'wss://' : 'ws://';
            const socket = new WebSocket(wsProtocol + loc.host + '{{.WebsocketPath}}');
            ws = socket;

            socket.onopen = function() {
                if (isPaused || ws !== socket) {
                    socket.close();
                    return;
                }
                updateConnectionStatusUI();
                sendActiveFilterToWS(socket);
            };

            socket.onmessage = function(event) {
                if (isPaused || ws !== socket) return;
                const v = JSON.parse(event.data);

                if (v.model) {
                    setModel(v.model);
                }

                const appIdent = v.ident;
                const hostIdent = v.host || null;
                let kindDimChanged = ingestKindDimensionPayload(v, appIdent, hostIdent);

                if (!appIdent) {
                    if (kindDimChanged) {
                        updateFilterLists();
                        refreshAllViews();
                    }
                    return;
                }

                const prevMatchingApps = new Set(getMatchingApps());

                addApplication(appIdent);
                const timeLabel = new Date(v.timestamp).toLocaleTimeString();

                if (v.points) {
                    v.points.forEach(point => {
                        if (!applicationCache[appIdent].rawSeries[point.metric]) {
                            applicationCache[appIdent].rawSeries[point.metric] = [];
                        }

                        const series = applicationCache[appIdent].rawSeries[point.metric];
                        const existingIndex = series.findIndex(pt => pt.time === timeLabel);
                        const pointData = {
                            time: timeLabel,
                            fullTimestamp: v.timestamp,
                            val: point.value,
                            up: point.max,
                            lo: point.min,
                            me: point.median,
                        };

                        if (existingIndex > -1) {
                            series[existingIndex] = pointData;
                        } else {
                            series.push(pointData);
                            if (series.length > 200) {
                                series.shift();
                            }
                        }
                    });
                }

                const updatedHostMetrics = new Set();
                let topologyChanged = false;
                if (v.hosts) {
                    if (Array.isArray(v.hosts)) {
                        v.hosts.forEach(hostObj => {
                            if (hostObj) {
                                if (ingestHostPoints(appIdent, hostObj.ident, hostObj.points, timeLabel, v.timestamp, updatedHostMetrics)) {
                                    topologyChanged = true;
                                }
                                if (ingestKindDimensionPayload(hostObj, appIdent, hostObj.ident)) {
                                    kindDimChanged = true;
                                }
                            }
                        });
                    } else if (typeof v.hosts === 'object') {
                        Object.entries(v.hosts).forEach(([key, val]) => {
                            if (Array.isArray(val)) {
                                if (ingestHostPoints(appIdent, key, val, timeLabel, v.timestamp, updatedHostMetrics)) {
                                    topologyChanged = true;
                                }
                            } else if (val && typeof val === 'object') {
                                if (ingestHostPoints(appIdent, val.ident || key, val.points, timeLabel, v.timestamp, updatedHostMetrics)) {
                                    topologyChanged = true;
                                }
                                if (ingestKindDimensionPayload(val, appIdent, val.ident || key)) {
                                    kindDimChanged = true;
                                }
                            }
                        });
                    }
                }

                if (v.verdict) {
                    if (!applicationCache[appIdent].verdicts) {
                        applicationCache[appIdent].verdicts = [];
                    }
                    const verdictObj = {
                        time: timeLabel,
                        fullTimestamp: v.timestamp,
                        host: hostIdent || v.verdict.host || null,
                        kind: v.kind || v.verdict.kind || null,
                        dimension: v.dimension || v.verdict.dimension || null,
                        verdict: v.verdict
                    };

                    const existingVerdictIdx = applicationCache[appIdent].verdicts.findIndex(item => item.time === timeLabel);
                    if (existingVerdictIdx > -1) {
                        applicationCache[appIdent].verdicts[existingVerdictIdx] = verdictObj;
                    } else {
                        applicationCache[appIdent].verdicts.unshift(verdictObj);
                        if (applicationCache[appIdent].verdicts.length > 50) {
                            applicationCache[appIdent].verdicts.pop();
                        }
                    }
                }

                const matchingApps = getMatchingApps();
                const matchingSetChanged =
                    matchingApps.length !== prevMatchingApps.size ||
                    matchingApps.some(a => !prevMatchingApps.has(a));

                if (topologyChanged || matchingSetChanged || kindDimChanged || v.verdict) {
                    syncHostInputWithAppFilter();
                    updateFilterLists();
                }

                if (matchingSetChanged) {
                    refreshAllViews();
                    return;
                }

                if (isAppFilterProvided() && matchingApps.includes(appIdent)) {
                    const showHostCharts = hasHostDataForMatchingApps();
                    const needsHostCardInit = showHostCharts &&
                                              Array.from(updatedHostMetrics).some(m => isHostMetric(m) && !charts[m]) &&
                                              (!maximizedChartKey || isHostMetric(maximizedChartKey));
                    if (needsHostCardInit) {
                        initCharts();
                    } else {
                        if (v.points) {
                            v.points.forEach(point => {
                                if (charts[point.metric]) {
                                    redrawChart(point.metric);
                                }
                            });
                        }
                        updatedHostMetrics.forEach(metric => {
                            if (charts[metric]) {
                                redrawChart(metric);
                            }
                        });
                    }

                    if (v.verdict) {
                        rebuildVerdictTable();
                    }
                } else if (v.verdict) {
                    rebuildVerdictTable();
                }
            };

            socket.onclose = function() {
                if (ws === socket) {
                    ws = null;
                }
                if (isPaused) {
                    updateConnectionStatusUI();
                    return;
                }
                updateConnectionStatusUI();
                setModel(null);
                setTimeout(connectWS, 3000);
            };
        }
    </script>
